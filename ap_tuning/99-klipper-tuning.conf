# Klipper, Moonraker & Crowsnest Network Optimizations
# Keep TCP window hot after idle (eliminates delay when returning to Mainsail/HelixScreen)
net.ipv4.tcp_slow_start_after_idle = 0

# Socket buffer ceiling for smooth camera streaming & large gcode file uploads
net.core.rmem_max = 2097152
net.core.wmem_max = 2097152

# TCP Fast Open for fast local API handshakes
net.ipv4.tcp_fastopen = 3
