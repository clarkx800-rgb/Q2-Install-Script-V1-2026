[gcode_macro TURN_OFF_HEATERS]
rename_existing: _BASE_TURN_OFF_HEATERS
description: Turn off all heaters and run the cooling fan silently until nozzle drops to 150C
gcode:
    _BASE_TURN_OFF_HEATERS

    {% set target_threshold = 150.0 %}
    {% set cur_temp = printer.extruder.temperature|float %}

    {% if cur_temp > target_threshold %}
        M106 S255
        UPDATE_DELAYED_GCODE ID=_COOLDOWN_FAN_MONITOR DURATION=2
    {% else %}
        M106 S0
    {% endif %}


[gcode_macro TURN_OFF_HEATER]
description: Alias for TURN_OFF_HEATERS to prevent singular/plural typos from failing
gcode:
    TURN_OFF_HEATERS


[delayed_gcode _COOLDOWN_FAN_MONITOR]
gcode:
    # Read the dynamic anti-ooze cutoff from teardown memory (default 150C)
    {% set cutoff = printer["gcode_macro _TEARDOWN_COOLDOWN_AND_SHUTDOWN"].cooldown_cutoff|default(150.0)|float %}
    {% set cur_temp = printer.extruder.temperature|float %}

    {% if printer.extruder.target > 0 %}
        # Extruder target actively commanded (e.g. new print); abort background cooldown
    {% elif cur_temp <= cutoff %}
        M106 S0
        RESPOND MSG="[INFO] Cooldown target reached ({cur_temp|round(1)}C <= {cutoff}C). Fan stopped."
    {% else %}
        M106 S255
        UPDATE_DELAYED_GCODE ID=_COOLDOWN_FAN_MONITOR DURATION=2
    {% endif %}