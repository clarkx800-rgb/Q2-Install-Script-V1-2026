# =========================================================================
# REAR CHUTE ALCOVE GLOBAL BOUNDARY GUARD
# Pocket Corridor: X85.0 to X183.0 allows Y travel up to Y_MAX (Y288+)
# Left Flank (X < 85.0) and Right Flank (X > 183.0) hard limit: Y <= 271.0
# =========================================================================

[gcode_macro G0]
description: Global safety interceptor for rapid moves
rename_existing: G0.1
gcode:
    _DISPATCH_SAFE_MOTION CMD=G0.1 RAW_PARAMS="{rawparams}" {% for k in params %}{k}="{params[k]}" {% endfor %}

[gcode_macro G1]
description: Global safety interceptor for linear moves
rename_existing: G1.1
gcode:
    _DISPATCH_SAFE_MOTION CMD=G1.1 RAW_PARAMS="{rawparams}" {% for k in params %}{k}="{params[k]}" {% endfor %}

[gcode_macro _DISPATCH_SAFE_MOTION]
gcode:
    {% set cmd = params.CMD|string %}
    {% set raw = params.RAW_PARAMS|string %}

    # Toolhead must be homed to enforce physical boundaries
    {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
        {% set cur_x = printer.toolhead.position.x|float %}
        {% set cur_y = printer.toolhead.position.y|float %}

        # Determine target X
        {% if 'X' in params or 'x' in params %}
            {% set val_x = params.X|default(params.x)|float %}
            {% set target_x = cur_x + val_x if printer.gcode_move.absolute_coordinates == False else val_x %}
        {% else %}
            {% set target_x = cur_x %}
        {% endif %}

        # Determine target Y
        {% if 'Y' in params or 'y' in params %}
            {% set val_y = params.Y|default(params.y)|float %}
            {% set target_y = cur_y + val_y if printer.gcode_move.absolute_coordinates == False else val_y %}
        {% else %}
            {% set target_y = cur_y %}
        {% endif %}

        # Physical alcove geometry limits
        {% set min_pocket_x = 85.0 %}
        {% set max_pocket_x = 183.0 %}
        {% set rear_wall_y   = 271.0 %}

        # -----------------------------------------------------------------
        # RULE 1: Direct Entry Violation (Destination hits the forward wall)
        # -----------------------------------------------------------------
        {% if target_y > rear_wall_y %}
            {% if target_x < min_pocket_x or target_x > max_pocket_x %}
                {action_raise_error("COLLISION PREVENTED: Target (X" ~ target_x|round(2) ~ " Y" ~ target_y|round(2) ~ ") impacts the rear wall. Outside X85-X183, Y cannot exceed 271mm.")}
            {% endif %}
        {% endif %}

        # -----------------------------------------------------------------
        # RULE 2: Lateral Sweep Violation (Jogging sideways while deeper than Y271)
        # -----------------------------------------------------------------
        {% if (cur_y > rear_wall_y or target_y > rear_wall_y) %}
            {% if (cur_x < min_pocket_x and target_x >= min_pocket_x) or 
                  (cur_x >= min_pocket_x and target_x < min_pocket_x) or 
                  (cur_x > max_pocket_x and target_x <= max_pocket_x) or 
                  (cur_x <= max_pocket_x and target_x > max_pocket_x) %}
                {action_raise_error("COLLISION PREVENTED: Lateral motion through alcove boundary wall at Y" ~ [cur_y, target_y]|max|round(2) ~ ". Step forward to Y271 first.")}
            {% endif %}
        {% endif %}

        # -----------------------------------------------------------------
        # RULE 3: Diagonal Exit Violation (Cutting corners when leaving alcove)
        # -----------------------------------------------------------------
        {% if cur_y > rear_wall_y and target_y <= rear_wall_y %}
            {% if target_x < min_pocket_x or target_x > max_pocket_x %}
                {% set dy = target_y - cur_y %}
                {% set dx = target_x - cur_x %}
                {% if dy|abs > 0.001 %}
                    {% set t = (rear_wall_y - cur_y) / dy %}
                    {% set intersect_x = cur_x + t * dx %}
                    {% if intersect_x < min_pocket_x or intersect_x > max_pocket_x %}
                        {action_raise_error("COLLISION PREVENTED: Diagonal move cuts through wall shoulder at X" ~ intersect_x|round(2) ~ ". Pull forward to Y271 first.")}
                    {% endif %}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}

    # Dispatch to low-level Klipper motion planner
    {cmd} {raw}