# ==============================================================================
# QIDI Q2 REFINED HOMING OVERRIDE (KALICO / DUAL INDEPENDENT Z)
# File: homing-only.cfg
# ==============================================================================

[gcode_macro HOMING_CONFIG]
description: Hardware geometry and safety heights for Q2 homing
variable_home_x: 135.0
variable_home_y: 135.0
variable_z_hop: 10.0
variable_z_hop_speed: 720        ; 12 mm/s * 60 (snappy, smooth leadscrew lift)
variable_xy_travel_speed: 12000  ; 200 mm/s * 60 (fast industrial transit)
variable_safe_z_park: 10.0
gcode:

[gcode_macro HOMING_STATE]
description: Tracks blind lift state during homing cycles
variable_z_blind_lift_done: 0
gcode:

[gcode_macro _RESET_HOMING_STATE]
description: Unconditionally resets the blind lift tracker at start of homing cycle
gcode:
    SET_GCODE_VARIABLE MACRO=HOMING_STATE VARIABLE=z_blind_lift_done VALUE=0

[gcode_macro _SAFE_Z_HOP]
description: Ensures vertical clearance before XY travel without racking dual leadscrews
gcode:
    {% set cfg = printer["gcode_macro HOMING_CONFIG"] %}
    {% set hop = cfg.z_hop|float %}
    {% set speed = cfg.z_hop_speed|float %}

    {% if 'z' in printer.toolhead.homed_axes %}
        # Z is known; hop only if nozzle is below the safety clearance threshold
        {% if printer.toolhead.position.z < hop %}
            G90
            G1 Z{hop} F{speed}
        {% endif %}
    {% else %}
        # Z is unknown; perform synchronized dual-motor lift without false homing flags
        {% if printer["gcode_macro HOMING_STATE"].z_blind_lift_done == 0 %}
            # Check if bed is already near bottom to prevent bottom-out crash
            {% set last_z = printer.toolhead.position.z|default(0)|float %}
            {% if last_z < 240.0 %}
                # 1. Establish temporary zero ONLY on Z (leaves unhomed X and Y untouched)
                SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
                # 2. Lift bed by hop distance (moves both Z motors in synchronized lockstep)
                G91
                G1 Z{hop} F{speed}
                G90
                # 3. Clear temporary Z homing state so Kalico knows Z is still uncalibrated
                SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
            {% else %}
                RESPOND MSG="[WARN] Bed already near bottom (Z=" ~ last_z|round(1)|string ~ "), skipping blind Z hop to prevent bottom-out"
            {% endif %}
            # 4. Mark lift complete for this homing cycle
            SET_GCODE_VARIABLE MACRO=HOMING_STATE VARIABLE=z_blind_lift_done VALUE=1
        {% endif %}
    {% endif %}

[gcode_macro _HOME_Y]
description: Internal routine to safely home the Y axis
gcode:
    _SAFE_Z_HOP
    G28 Y

[gcode_macro _HOME_X]
description: Internal routine to safely home the X axis
gcode:
    _SAFE_Z_HOP
    G28 X

[gcode_macro _HOME_Z]
description: Internal routine to home XY first, center, settle load cell, and probe Z
gcode:
    {% set cfg = printer["gcode_macro HOMING_CONFIG"] %}

    # 1. Enforce Y then X homing order if not already homed
    {% if 'y' not in printer.toolhead.homed_axes %}
        _HOME_Y
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes %}
        _HOME_X
    {% endif %}

    # 2. Ensure clearance prior to centering move
    _SAFE_Z_HOP

    # 3. Fast transit to bed center reference (X135 Y135)
    G90
    G1 X{cfg.home_x} Y{cfg.home_y} F{cfg.xy_travel_speed}
    M400
    
    # 4. Mechanical settle dwell (allows frame & load cell vibrations to relax)
    G4 P300

    # 5. Probe Z zero via CS1237 load cell
    G28 Z

    # 6. Post-probe park lift
    G90
    G1 Z{cfg.safe_z_park} F{cfg.z_hop_speed}

[homing_override]
axes: xyz
gcode:
    # 1. Clear bed mesh before any homing reference is established
    BED_MESH_CLEAR

    # 2. Reset the blind lift tracker for this homing command
    _RESET_HOMING_STATE

    # 3. Reset speed factor to 100%
    M220 S100

    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    # Enforce safe physical order: Y -> X -> Z
    {% if home_all or 'Y' in params %}
        _HOME_Y
    {% endif %}

    {% if home_all or 'X' in params %}
        _HOME_X
    {% endif %}

    {% if home_all or 'Z' in params %}
        _HOME_Z
    {% endif %}

    # 4. Guarantee printer remains in absolute positioning mode
    G90


[gcode_shell_command backup_cfg]
command: ~/klipper-backup/script.sh
timeout: 300
verbose: True

[gcode_macro BACKUP_CFG]
description: Backs up config files to Git with custom name or interactive prompt
variable_name: ""
gcode:
    {% set custom_name = params.NAME|default(params.MESSAGE|default("")) %}
    {% if custom_name != "" %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=echo MSG="[GIT] Backing up configs to GitHub with message: '{custom_name}'..."
        RUN_SHELL_COMMAND CMD=backup_cfg PARAMS='-c "{custom_name}"'
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin GitHub Backup"
        RESPOND TYPE=command MSG="action:prompt_text Select a backup mode or run: BACKUP_CFG NAME=\"your note\""
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button 📅 Timestamp|_BACKUP_CFG_EXEC NAME=Timestamp|primary"
        RESPOND TYPE=command MSG="action:prompt_button 🛡️ Baseline|_BACKUP_CFG_EXEC NAME=Safeguarded-Baseline|secondary"
        RESPOND TYPE=command MSG="action:prompt_button 🔧 Tuning|_BACKUP_CFG_EXEC NAME=Tuning-Update|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_footer_button ❌ Dismiss|action:prompt_end|error"
        RESPOND TYPE=command MSG="action:prompt_show"
        RESPOND TYPE=echo MSG="[GIT] Opened backup prompt. (To pass a custom message directly, run: BACKUP_CFG NAME=\"your message\")"
    {% endif %}

[gcode_macro _BACKUP_CFG_EXEC]
description: Internal execution helper for GitHub backup prompt
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set name = params.NAME|default("") %}
    {% if name == "Timestamp" or name == "" %}
        RESPOND TYPE=echo MSG="[GIT] Backing up configs with default timestamp..."
        RUN_SHELL_COMMAND CMD=backup_cfg
    {% else %}
        RESPOND TYPE=echo MSG="[GIT] Backing up configs with message: '{name}'..."
        RUN_SHELL_COMMAND CMD=backup_cfg PARAMS='-c "{name}"'
    {% endif %}

