# ==============================================================================
# LOAD / UNLOAD / KINEMATIC MODULATION
# File: load-unload-modulation.cfg
# ==============================================================================

[gcode_macro MOVE_TO_TRASH]
description: Corridor-safe continuous entry to trash chute (X91 center)
gcode:
    {% set target_x = params.X|default(91.0)|float %}
    {% set target_y = params.Y|default(288.0)|float %}
    {% set f_speed = params.F|default(12000)|int %}
    {% set corridor_y = 271.0 %}
    {% set clear_y = 267.0 %}
    {% set cur_x = printer.toolhead.position.x|float %}
    {% set cur_y = printer.toolhead.position.y|float %}
    {% set safe_min_z = 5.0 %}

    # Explicit axis homing verification
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}

    # Safety Z lift: guarantee clearance over bed/brackets before any XY transit
    {% if 'z' in printer.toolhead.homed_axes %}
        {% if printer.toolhead.position.z < safe_min_z %}
            G1 Z{safe_min_z} F1200
        {% endif %}
    {% endif %}

    G90
    M204 S6000

    # Check if toolhead is already aligned within the chute channel mouth (X89 to X93)
    {% set in_chute_channel = (cur_x >= 89.0 and cur_x <= 93.0) %}

    {% if in_chute_channel %}
        # Already inside/aligned with chute corridor opening; direct glide in
        {% if cur_y < corridor_y %}
            G1 Y{corridor_y} F{f_speed}
        {% endif %}
        G1 X{target_x} Y{target_y} F4000
    {% else %}
        # Outside chute channel in X.
        # If at or behind clear_y (corridor boundary or rear mechanism shelf),
        # step straight forward to clear_y first to clear all brackets and chute brim.
        {% if cur_y >= clear_y %}
            G1 Y{clear_y} F6000
        {% endif %}

        # Move across open bed space to align with chute entry centerline (target_x)
        G1 X{target_x} Y{clear_y} F{f_speed}

        # Enter the corridor mouth at Y271
        G1 Y{corridor_y} F6000

        # Glide into final chute pocket
        G1 Y{target_y} F4000
    {% endif %}
    M400


[gcode_macro EXIT_TRASH_CORRIDOR]
description: Safe forward exit out of the rear chute cavity before open lateral travel
gcode:
    {% set corridor_y = 271.0 %}
    {% set clear_y = 267.0 %}
    {% set cur_y = printer.toolhead.position.y|float %}
    G90
    {% if cur_y > clear_y %}
        G1 Y{clear_y} F6000
    {% endif %}
    M400

[gcode_macro CUT_FILAMENT_1]
description: Physical gantry pin filament cut sequence for Qidi Q2
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    M400
    G90
    {% if printer.toolhead.position.x < 20 %}
        G1 X20 F9000
    {% endif %}
    G1 Y0.5 F9000
    G1 X15 F12000
    G1 X-0.5 F3000
    G4 P400
    G1 X5 F3000
    G1 X-0.5 F3000
    G4 P400
    G1 X20 F6000
    MOVE_TO_TRASH

[gcode_macro MANUAL_FILAMENT_LOAD]
description: Manual gate load from Mainsail / UI
gcode:
    LOAD_FILAMENT {rawparams}

[gcode_macro MANUAL_FILAMENT_UNLOAD]
description: Safe manual unload with automatic physical pin cut and cooldown
gcode:
    UNLOAD_FILAMENT {rawparams}

[gcode_macro MMU_MANUAL_JOG]
description: Interactive filament jog modal for Mainsail / Fluidd
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set distance = params.DISTANCE|default(100)|float %}
    {% set speed = params.SPEED|default(20)|float %}
    {% if tool >= 0 %}
        MMU_SELECT GATE={tool}
    {% endif %}
    MMU_TEST_MOVE MOVE={distance} SPEED={speed}

[gcode_macro EXTRUSION_AND_FLUSH]
description: Dynamic thermal startup purge that safely manages cold plug residue.
gcode:
    {% set current_temp = params.HOTEND|default(220)|int %}
    {% set next_high_temp = params.NEXT_HIGH_TEMP|default(240)|int %}
    {% set last_temp = printer.save_variables.variables.last_filament_temp|default(0)|float|int %}
    {% set skip_wipe = params.SKIP_WIPE|default(0)|int %}
    MOVE_TO_TRASH
    {% if last_temp > current_temp %}
        M109 S{last_temp}
        M83
        G1 E80 F480
        M400
        G1 E-1 F1800
        M400
        M106 S255
        M109 S{next_high_temp}
        M106 S0   
        {% if skip_wipe == 0 %}
            CLEAR_NOZZLE HOTEND={next_high_temp}
        {% endif %}
    {% else %}
        M109 S{next_high_temp}
        M83
        G1 E50 F300
        M400
        G1 E-1 F1800
        M400
        {% if skip_wipe == 0 %}
            M104 S170
            M109 S170
            CLEAR_NOZZLE HOTEND=170
        {% endif %}
    {% endif %}

[gcode_macro CLEAR_NOZZLE]
description: Smart mechanical scrub routine to cleanly wipe the nozzle using the built-in brush.
gcode:
    {% set hotendtemp = params.HOTEND|default(250)|int %}
    {% set wipe_temp = params.WIPE_TEMP|default(0)|int %}
    {% set min_extrude = printer.configfile.settings.extruder.min_extrude_temp|default(175)|float %}
    {% if wipe_temp == 0 %}
        {% if hotendtemp <= 225 %}
            {% set wipe_temp = 160 %}
        {% elif hotendtemp <= 245 %}
            {% set wipe_temp = 175 %}
        {% elif hotendtemp <= 265 %}
            {% set wipe_temp = 190 %}
        {% elif hotendtemp <= 310 %}
            {% set wipe_temp = 210 %}
        {% else %}
            {% set wipe_temp = 260 %}
        {% endif %}
    {% endif %}
    MOVE_TO_TRASH
    M400
    M109 S{hotendtemp}
    {% if hotendtemp >= min_extrude %}
        G92 E0
        G1 E5 F80
        G92 E0
        G1 E25 F300
        G92 E0
        G1 E-2 F200
        M400
    {% endif %}
    M106 S255
    G4 P1000
    M104 S{wipe_temp}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={wipe_temp}
    M204 S5000
    {% for i in range(5) %}
        G1 X103 F5000
        G1 X90 F5000
    {% endfor %}
    {% for i in range(7) %}
        G1 X114 F5000
        G1 X100 F5000
    {% endfor %}
    {% for i in range(5) %}
        G1 X103 F5000
        G1 X90 F5000
    {% endfor %}
    G1 X125 F15000
    G1 X130 Y280 F6000
    G1 Z-0.2 F600
    M106 S255
    M104 S140
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=140
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G1 X140 F200
    G1 Y281 F200
    G1 X130 F200
    G1 Y283 F200
    G1 X140 F200
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G1 Z0.2
    G1 X180 F12000
    G1 Z-1.5
    {% for i in range(5) %}
        G1 X164 F12000
        G1 X180 F12000
    {% endfor %}
    M400
    G1 Z30 F900
    G1 X135 Y135 F15000
    M106 S0

[gcode_macro CLEAR_NOZZLE_PLR]
description: Power-loss recovery nozzle clear routine.
gcode:
    {% set hotendtemp = params.HOTEND|default(250)|int %}
    G91
    G1 Z5 F900 
    G90
    MOVE_TO_TRASH
    M109 S{hotendtemp}
    G92 E0
    G1 E80 F400
    M106 S255
    {% for i in range(4) %}
        G1 X115 F5000
        G1 X95 F15000
    {% endfor %}
    G1 X125 F15000

[gcode_macro SHAKE_OOZE]
description: Performs a rapid back-and-forth movement to flick off hanging filament debris.
gcode:
    MOVE_TO_TRASH
    M204 S2000
    M400
    G4 P500
    G91 
    {% for y in range(1,14) %}
        G1 Y-1 F20000
        G1 Y1 F20000
    {% endfor %}
    G90

[gcode_macro M604]
description: Filament load sequence via MMU
gcode:
    LOAD_FILAMENT {rawparams}