# ==============================================================================
# MODULATION LIBRARY (Lifecycle Sub-Routines)
# File: modulation.cfg
# ==============================================================================

# ------------------------------------------------------------------------------
# STATE MACHINE VARIABLES
# ------------------------------------------------------------------------------
[gcode_macro _PRINT_VARS]
variable_bed_temp: 0
variable_hotend_temp: 0
variable_chamber_temp: 0
variable_fil_class: 'Unknown'
variable_wipe_temp: 0
variable_tap_temp: 0
variable_pre_purge_tap_temp: 0
variable_pre_purge_wipe_temp: 0
variable_flush_temp: 0
variable_load_retracted_10mm: 0
variable_is_print_start: 0
variable_is_purged: 0
gcode:
    # Empty macro to hold variables

# ------------------------------------------------------------------------------
# PRINT START MODULES
# ------------------------------------------------------------------------------
[gcode_macro _CALCULATE_THERMAL_PROFILE]
gcode:
    {% set bedtemp = params.BED|default(55)|int %}
    {% set hotendtemp = params.HOTEND|default(220)|int %}
    {% set next_high_temp = params.NEXT_HIGH_TEMP|default(hotendtemp)|int %}
    {% set raw_chamber = params.CHAMBER|default(0)|int %}
    {% set extruder = params.EXTRUDER|default(0)|int %}
    
    {% set raw_fil = params.FILAMENT|default(params.FILAMENT_TYPE|default(''))|string|upper %}
    {% if raw_fil == '' and printer.mmu.gate_material is defined and extruder >= 0 and extruder < printer.mmu.gate_material|length %}
        {% set raw_fil = printer.mmu.gate_material[extruder]|string|upper %}
    {% endif %}
    {% if raw_fil == '' %}
        {% set raw_fil = printer.save_variables.variables.last_filament_type|default('UNKNOWN')|string|upper %}
    {% endif %}

    {% if 'PPS' in raw_fil or 'PEEK' in raw_fil or 'PEKK' in raw_fil %}
        {% set fil_class = 'PPS-CF' %}
        {% set wipe_temp = 250 %}
        {% set tap_temp = 185 %}
        {% set allow_chamber = True %}
        {% set default_chamber = 65 %}
    {% elif 'PA' in raw_fil or 'NYLON' in raw_fil %}
        {% set fil_class = 'Nylon/PA' %}
        {% set wipe_temp = 220 %}
        {% set tap_temp = 170 %}
        {% set allow_chamber = True %}
        {% set default_chamber = 55 %}
    {% elif 'PC' in raw_fil or 'ABS-PC' in raw_fil %}
        {% set fil_class = 'PC/PC-ABS' %}
        {% set wipe_temp = 210 %}
        {% set tap_temp = 165 %}
        {% set allow_chamber = True %}
        {% set default_chamber = 60 %}
    {% elif 'ABS' in raw_fil or 'ASA' in raw_fil %}
        {% set fil_class = 'ABS/ASA' %}
        {% set wipe_temp = 190 %}
        {% set tap_temp = 155 %}
        {% set allow_chamber = True %}
        {% set default_chamber = 60 %}
    {% elif 'PET' in raw_fil %}
        {% set fil_class = 'PETG' %}
        {% set wipe_temp = 175 %}
        {% set tap_temp = 145 %}
        {% set allow_chamber = False %}
        {% set default_chamber = 0 %}
    {% elif 'PLA' in raw_fil %}
        {% set fil_class = 'PLA' %}
        {% set wipe_temp = 160 %}
        {% set tap_temp = 130 %}
        {% set allow_chamber = False %}
        {% set default_chamber = 0 %}
    {% elif 'TPU' in raw_fil or 'FLEX' in raw_fil or 'TPE' in raw_fil %}
        {% set fil_class = 'TPU/Flex' %}
        {% set wipe_temp = 160 %}
        {% set tap_temp = 135 %}
        {% set allow_chamber = False %}
        {% set default_chamber = 0 %}
    {% else %}
        {% if hotendtemp >= 300 %}
            {% set fil_class = 'High-Temp' %}
            {% set wipe_temp = 250 %}
            {% set tap_temp = 185 %}
            {% set allow_chamber = True %}
            {% set default_chamber = 60 %}
        {% elif hotendtemp >= 270 %}
            {% set fil_class = 'Engineered' %}
            {% set wipe_temp = 220 %}
            {% set tap_temp = 170 %}
            {% set allow_chamber = True %}
            {% set default_chamber = 55 %}
        {% elif hotendtemp >= 250 %}
            {% set fil_class = 'Mid-Temp' %}
            {% set wipe_temp = 190 %}
            {% set tap_temp = 155 %}
            {% set allow_chamber = True %}
            {% set default_chamber = 50 %}
        {% elif hotendtemp >= 230 %}
            {% set fil_class = 'Standard' %}
            {% set wipe_temp = 175 %}
            {% set tap_temp = 145 %}
            {% set allow_chamber = False %}
            {% set default_chamber = 0 %}
        {% else %}
            {% set fil_class = 'Low-Temp' %}
            {% set wipe_temp = 160 %}
            {% set tap_temp = 130 %}
            {% set allow_chamber = False %}
            {% set default_chamber = 0 %}
        {% endif %}
    {% endif %}

    {% if allow_chamber %}
        {% set chambertemp = raw_chamber if raw_chamber > 0 else default_chamber %}
    {% else %}
        {% set chambertemp = 0 %}
    {% endif %}

    # 2. Resolve Remnant Filament Physically in the Nozzle Before Purge
    {% set last_fil = printer.save_variables.variables.last_filament_type|default('')|string|upper %}
    {% set last_temp = printer.save_variables.variables.last_filament_temp|default(0)|int %}

    {% if 'PPS' in last_fil or 'PEEK' in last_fil or 'PEKK' in last_fil %}
        {% set remnant_tap = 185 %}
        {% set remnant_wipe = 250 %}
    {% elif 'PA' in last_fil or 'NYLON' in last_fil %}
        {% set remnant_tap = 170 %}
        {% set remnant_wipe = 220 %}
    {% elif 'PC' in last_fil or 'ABS-PC' in last_fil %}
        {% set remnant_tap = 165 %}
        {% set remnant_wipe = 210 %}
    {% elif 'ABS' in last_fil or 'ASA' in last_fil %}
        {% set remnant_tap = 155 %}
        {% set remnant_wipe = 190 %}
    {% elif 'PET' in last_fil %}
        {% set remnant_tap = 145 %}
        {% set remnant_wipe = 175 %}
    {% elif 'PLA' in last_fil %}
        {% set remnant_tap = 130 %}
        {% set remnant_wipe = 160 %}
    {% elif 'TPU' in last_fil or 'FLEX' in last_fil or 'TPE' in last_fil %}
        {% set remnant_tap = 135 %}
        {% set remnant_wipe = 160 %}
    {% else %}
        {% if last_temp >= 300 %}
            {% set remnant_tap = 185 %}
            {% set remnant_wipe = 250 %}
        {% elif last_temp >= 270 %}
            {% set remnant_tap = 170 %}
            {% set remnant_wipe = 220 %}
        {% elif last_temp >= 250 %}
            {% set remnant_tap = 155 %}
            {% set remnant_wipe = 190 %}
        {% elif last_temp >= 230 %}
            {% set remnant_tap = 145 %}
            {% set remnant_wipe = 175 %}
        {% elif last_temp > 150 %}
            {% set remnant_tap = 130 %}
            {% set remnant_wipe = 160 %}
        {% else %}
            {% set remnant_tap = tap_temp %}
            {% set remnant_wipe = wipe_temp %}
        {% endif %}
    {% endif %}

    # 3. Compute Pre-Purge Thresholds
    # Before the remnant plug is purged into the chute, the nozzle must not exceed
    # the softening / oozing temperature of the lower-temp material currently in the nozzle.
    {% set pre_purge_tap_temp = [tap_temp, remnant_tap]|min %}
    {% set pre_purge_wipe_temp = [wipe_temp, remnant_wipe]|min %}
    {% set flush_temp = [last_temp, next_high_temp]|max %}

    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=bed_temp VALUE={bedtemp}
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=hotend_temp VALUE={hotendtemp}
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=chamber_temp VALUE={chambertemp}
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=fil_class VALUE='"{fil_class}"'
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=wipe_temp VALUE={wipe_temp}
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=tap_temp VALUE={tap_temp}
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=pre_purge_tap_temp VALUE={pre_purge_tap_temp}
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=pre_purge_wipe_temp VALUE={pre_purge_wipe_temp}
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=flush_temp VALUE={flush_temp}
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=is_purged VALUE=0

    {% set disp_remnant = last_fil if last_fil != '' else 'None' %}
    RESPOND MSG="[SYS] Profile: {fil_class} | Bed: {bedtemp}C | Hotend: {hotendtemp}C | Tap: {tap_temp}C (Pre-Purge Safe Tap: {pre_purge_tap_temp}C for remnant {disp_remnant})"

[gcode_macro _HEATSOAK_SETUP]
description: Concurrent bed, chamber, and nozzle preheat (safe pre-purge tap temp)
gcode:
    {% set vars = printer["gcode_macro _PRINT_VARS"] %}
    M140 S{vars.bed_temp}
    # Pre-warm nozzle to safe pre-purge tap temp (never exceeds remnant softening point)
    M104 S{vars.pre_purge_tap_temp}
    
    {% if vars.chamber_temp > 0 %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
        {% if printer['fan_generic auxiliary_cooling_fan'] is defined %}
            SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=1.0
        {% endif %}
        M141 S{vars.chamber_temp}
    {% else %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
        {% if printer['fan_generic auxiliary_cooling_fan'] is defined %}
            SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0
        {% endif %}
        M141 S0
    {% endif %}
    
    M190 S{vars.bed_temp}
    
    {% if vars.chamber_temp > 0 %}
        {% set target_chamber = [vars.chamber_temp, 65]|min %}
        {% set current_ch = printer["heater_generic chamber"].temperature|default(0)|float %}
        {% if current_ch < (target_chamber - 2.0) %}
            RESPOND MSG="[SYS] Bed stabilized at {vars.bed_temp}C. Actively soaking chamber to {target_chamber}C..."
            TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={target_chamber - 2.0}
        {% endif %}
        RESPOND MSG="[SYS] Chamber thermal equilibrium reached ({target_chamber}C)"
        {% if printer['fan_generic auxiliary_cooling_fan'] is defined %}
            SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0
        {% endif %}
    {% endif %}

[gcode_macro _REFERENCE_HOMING]
description: Initial reference homing at safe pre-purge tap temp
gcode:
    {% set vars = printer["gcode_macro _PRINT_VARS"] %}
    # Thermal check: ensure nozzle is conditioned to pre_purge_tap_temp before Z probe tap
    {% if printer.extruder.temperature > (vars.pre_purge_tap_temp + 2) %}
        M104 S{vars.pre_purge_tap_temp}
        M106 S255
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={vars.pre_purge_tap_temp + 2}
        M106 S0
    {% elif printer.extruder.temperature < (vars.pre_purge_tap_temp - 5) %}
        M104 S{vars.pre_purge_tap_temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={vars.pre_purge_tap_temp - 5}
    {% endif %}
    G28
    SET_GCODE_OFFSET Z=0 MOVE=0

[gcode_macro _REMNANT_PURGE]
description: 100% stationary continuous purge with thermal freeze shock over chute
gcode:
    {% set vars = printer["gcode_macro _PRINT_VARS"] %}
    {% set extruder = params.EXTRUDER|int %}
    
    MOVE_TO_TRASH
    M106 S0
    M109 S{vars.flush_temp}
    
    # 1. Ensure initial tool is loaded into nozzle
    T{extruder}
    
    # Ensure toolhead is safely parked over chute void
    MOVE_TO_TRASH
    M400
    
    SAVE_GCODE_STATE NAME=pre_purge_state
    G90
    M83
    {% set last_temp = printer.save_variables.variables.last_filament_temp|default(0)|int %}
    {% set purge_len = 75.0 if last_temp > vars.hotend_temp else 45.0 %}
    
    # 2. 100% Stationary purge at chute center (X91 Y288)
    G1 E5.0 F80                                      # Gentle prime to anchor bead downwards
    G1 E{purge_len - 5.0} F300                       # Continuous steady purge straight into chute
    M400

    # 3. Trigger active cooldown & part fan 100%
    M104 S{vars.wipe_temp + 10}
    M106 S255

    # 4. 1-second freeze dwell to solidify purge root over chute void
    G4 P1000

    # 5. Slow 8mm anti-ooze retraction at 15mm/s (F900) while core is still fully liquid
    G1 E-8.0 F900
    M400

    # 6. Wait for nozzle to reach wipe_temp + 10 over chute void with fan active
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={vars.wipe_temp + 10}
    M106 S0
    
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=load_retracted_10mm VALUE=1
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=is_purged VALUE=1

    # Persist the newly loaded and purged filament identity to disk now that it is in the nozzle
    SAVE_VARIABLE VARIABLE=last_filament_temp VALUE={vars.hotend_temp}
    SAVE_VARIABLE VARIABLE=last_print_temp VALUE={vars.hotend_temp}
    SAVE_VARIABLE VARIABLE=last_filament_type VALUE='"{vars.fil_class}"'

    RESPOND MSG="[SYS] Remnant purge complete ({vars.fil_class}). Cooled to {vars.wipe_temp + 10}C with 8mm anti-ooze retract."
    RESTORE_GCODE_STATE NAME=pre_purge_state

[gcode_macro _PROBE_MESH]
description: Pre-probe thermal conditioning to tap_temp, Z-tilt adjustment, and bed meshing
gcode:
    {% set vars = printer["gcode_macro _PRINT_VARS"] %}
    {% set is_purged = vars.is_purged|default(0)|int %}
    {% set tap_temp = vars.tap_temp if is_purged == 1 else vars.pre_purge_tap_temp|default(140)|int %}

    # 1. Thermal conditioning: Fan assist to cooldown from wipe_temp to tap_temp
    {% if printer.extruder.temperature > (tap_temp + 1) %}
        RESPOND MSG="[CAL] Fan cooling nozzle from {printer.extruder.temperature|round(0)|int}C to {tap_temp}C for Z-tilt & meshing..."
        M104 S{tap_temp}
        M106 S255
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={tap_temp + 1}
    {% elif printer.extruder.temperature < (tap_temp - 2) %}
        M104 S{tap_temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={tap_temp - 2}
    {% endif %}

    # 2. Fans OFF before starting Z-tilt adjust & probing (eliminates airflow/vibration on load cell)
    M106 S0
    M106 P2 S0
    M400

    # 3. Z-tilt adjustment & bed mesh sequence at tap_temp
    G28 Z
    Z_TILT_ADJUST
    G0 X135 Y135 F6000
    G28 Z
    
    # 4. Resolve Bed Mesh Probing Decision
    # Evaluation priority:
    #   a) Explicit G-code parameters passed to PRINT_START / _PROBE_MESH (SKIP_BED_MESH / SKIP_MESH / BED_MESH)
    #   b) Live UI toggle switch in Mainsail/Fluidd (output_pin Bed_Mesh)
    #   c) Saved persistent variable in saved_variables.cfg (enable_bed_mesh)
    {% set param_skip = params.SKIP_BED_MESH|default(params.SKIP_MESH|default(-1))|int %}
    {% set param_mesh = params.BED_MESH|default(-1)|int %}

    {% if param_skip == 1 or param_mesh == 0 %}
        {% set should_probe = 0 %}
    {% elif param_skip == 0 or param_mesh == 1 %}
        {% set should_probe = 1 %}
    {% elif 'output_pin Bed_Mesh' in printer %}
        {% set should_probe = printer['output_pin Bed_Mesh'].value|int %}
    {% else %}
        {% set should_probe = printer.save_variables.variables.enable_bed_mesh|default(1)|int %}
    {% endif %}

    {% if should_probe == 1 %}
        RESPOND MSG="[CAL] Adaptive bed mesh active"
        G29
    {% else %}
        RESPOND MSG="[CAL] Bed mesh bypassed: loading saved profile"
        BED_MESH_CLEAR
        {% if "default" in printer.bed_mesh.profiles %}
            BED_MESH_PROFILE LOAD=default
            SAVE_VARIABLE VARIABLE=profile_name VALUE='"default"'
            RESPOND MSG="[CAL] Loaded 'default' full bed mesh profile"
        {% elif "kamp" in printer.bed_mesh.profiles %}
            BED_MESH_PROFILE LOAD=kamp
            SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
            RESPOND MSG="[CAL] Loaded 'kamp' bed mesh profile"
        {% elif "adaptive" in printer.bed_mesh.profiles %}
            BED_MESH_PROFILE LOAD=adaptive
            SAVE_VARIABLE VARIABLE=profile_name VALUE='"adaptive"'
            RESPOND MSG="[CAL] Loaded 'adaptive' bed mesh profile"
        {% else %}
            RESPOND TYPE=error MSG="[CAL] Warning: No saved bed mesh profile found! Printing without mesh compensation."
        {% endif %}
    {% endif %}

[gcode_macro _LAUNCH_PRINT]
gcode:
    {% set vars = printer["gcode_macro _PRINT_VARS"] %}
    M104 S{vars.hotend_temp}
    G0 Z10 F1200
    G0 X68 Y1 F15000
    
    M109 S{vars.hotend_temp}
    M204 S6000
    {% set Polar_cooler = printer.save_variables.variables.enable_polar_cooler|default(0) %}
    M106 P4 S{Polar_cooler}
    set_zoffset
    ENABLE_ALL_SENSOR
    save_last_file
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=is_print_start VALUE=0
    
    RESPOND MSG="[SYS] Commencing print"

# ------------------------------------------------------------------------------
# TEARDOWN & CANCEL MODULES
# ------------------------------------------------------------------------------
[gcode_macro _TEARDOWN_RETRACT_AND_LIFT]
gcode:
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    # Leave 3.0mm headroom below axis_maximum to absorb babysteps and mesh offsets
    {% set safe_max_lift = max_z - 3.0 %}
    {% set safe_hop_z = [[cur_z + 2.0, safe_max_lift]|min, cur_z]|max %}

    {% set current_temp = printer.extruder.temperature|float %}
    {% if current_temp >= 180.0 %}
        SET_GCODE_VARIABLE MACRO=_CUSTOM_POST_LOAD_ACTION VARIABLE=last_material_temp VALUE={current_temp}
    {% endif %}

    {% if printer.extruder.can_extrude %}
        M83
        G1 E-10.0 F1800
        M400
        RESPOND MSG="[SYS] Pre-unload 10mm anti-ooze retraction applied."
        SET_GCODE_VARIABLE MACRO=_CUSTOM_PRE_UNLOAD_ACTION VARIABLE=retraction_applied VALUE=1
    {% endif %}

    G90
    # Only command a lift if there is genuine upward travel available
    {% if safe_hop_z > cur_z %}
        G1 Z{safe_hop_z} F1200
    {% endif %}

    # Step forward out of chute pocket before open transit
    EXIT_TRASH_CORRIDOR
    M400

    #G0 X130 Y0.5 F15000


[gcode_macro _TEARDOWN_BED_DROP]
gcode:
    {% set is_cancel = params.IS_CANCEL|default(0)|int %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set safe_max_z = max_z - 5.0 %}
    {% set disable_threshold = safe_max_z - 20.0 %}

    {% if cur_z >= disable_threshold %}
        RESPOND MSG="[SYS] Current Z ({cur_z|round(1)}mm) near max range ({max_z|round(1)}mm). Bed drop disabled to prevent bottom-out crash."
    {% else %}
        {% if is_cancel %}
            {% set target_z = [cur_z + 20.0, safe_max_z]|min %}
        {% else %}
            {% set print_height = params.MAX_LAYER_Z|default(cur_z)|float %}
            {% set target_z = [[print_height, cur_z]|max + 25.0, safe_max_z]|min %}
        {% endif %}

        {% if target_z > cur_z %}
            G90
            G0 Z{target_z} F800
            RESPOND MSG="[SYS] Bed dropped to Z={target_z|round(1)}mm."
        {% endif %}
    {% endif %}


[gcode_macro _RECORD_THERMAL_MEMORY]
gcode:
    {% set is_cancel = params.IS_CANCEL|default(0)|int %}
    {% set cur_extruder = params.CUR_EXTRUDER|default(-1)|int %}
    {% if cur_extruder < 0 and printer.mmu is defined and printer.mmu.tool is defined and printer.mmu.tool >= 0 %}
        {% set cur_extruder = printer.mmu.tool|int %}
    {% endif %}

    # Resolve recorded meltzone temperature: prioritize commanded hotend target from print vars, else measured temperature
    {% set vars = printer["gcode_macro _PRINT_VARS"]|default({}) %}
    {% set print_hotend = vars.hotend_temp|default(0)|int %}
    {% if print_hotend > 150 %}
        {% set active_temp = print_hotend %}
    {% else %}
        {% set active_temp = [printer.extruder.target|float, printer.extruder.temperature|float]|max|int %}
    {% endif %}

    # 1. Resolve Filament Type (never wipe out with Unknown or blank)
    {% set fil_type = params.FILAMENT_TYPE|default("")|string|upper %}
    {% if fil_type == "UNKNOWN" or fil_type == "" %}
        {% if vars.fil_class is defined and vars.fil_class != "Unknown" and vars.fil_class != "" %}
            {% set fil_type = vars.fil_class|string|upper %}
        {% elif printer.mmu.gate_material is defined and cur_extruder >= 0 and cur_extruder < printer.mmu.gate_material|length %}
            {% set fil_type = printer.mmu.gate_material[cur_extruder]|string|upper %}
        {% endif %}
    {% endif %}

    # 2. Resolve Filament Name
    {% set fil_name = params.FILAMENT_NAME|default("")|string %}
    {% if fil_name == "UNKNOWN" or fil_name == "" %}
        {% if printer.mmu.gate_filament_name is defined and cur_extruder >= 0 and cur_extruder < printer.mmu.gate_filament_name|length %}
            {% set fil_name = printer.mmu.gate_filament_name[cur_extruder]|string %}
        {% elif fil_type != "" and fil_type != "UNKNOWN" %}
            {% set fil_name = fil_type %}
        {% endif %}
    {% endif %}

    # 3. Persist valid filament identity and thermal history (both for PRINT_END and CANCEL_PRINT)
    # Only update last_filament_type if the new filament was actually purged into the nozzle (is_purged == 1) or not a print start cancellation
    {% set is_purged = vars.is_purged|default(1)|int %}
    {% if not is_cancel or is_purged == 1 %}
        {% if fil_type != "" and fil_type != "UNKNOWN" %}
            SAVE_VARIABLE VARIABLE=last_filament_type VALUE='"{fil_type}"'
            SAVE_VARIABLE VARIABLE=last_filament_name VALUE='"{fil_name}"'
        {% endif %}
    {% else %}
        RESPOND MSG="[SYS] Cancelled before remnant purge: preserving existing remnant filament memory."
    {% endif %}

    {% if active_temp > 150 %}
        SAVE_VARIABLE VARIABLE=last_filament_temp VALUE={active_temp}
        SAVE_VARIABLE VARIABLE=last_print_temp VALUE={active_temp}
        RESPOND MSG="[SYS] Thermal memory saved: {fil_type} at {active_temp}C ({'CANCELLED' if is_cancel else 'COMPLETE'})"
    {% endif %}

    {% if not is_cancel and printer.print_stats.filament_used is defined %}
        SAVE_VARIABLE VARIABLE=last_filament VALUE="'{printer.print_stats.filament_used|round(2)}m'"
    {% endif %}


[gcode_macro _TEARDOWN_CUT_FILAMENT]
description: Physical gantry pin filament cut immediately after retract and lift
variable_cut_performed: 0
gcode:
    {% if printer.mmu is defined and printer.mmu.enabled %}
        {% if printer.mmu.filament_pos != 0 and printer.mmu.tool >= 0 %}
            RESPOND MSG="[SYS] Immediate post-print filament cut..."
            _MMU_CUT_TIP
            SET_GCODE_VARIABLE MACRO=_TEARDOWN_CUT_FILAMENT VARIABLE=cut_performed VALUE=1
        {% else %}
            RESPOND MSG="[SYS] Tool already empty, skipping cut."
            SET_GCODE_VARIABLE MACRO=_TEARDOWN_CUT_FILAMENT VARIABLE=cut_performed VALUE=0
        {% endif %}
    {% elif printer['gcode_macro CUT_FILAMENT_1'] is defined %}
        RESPOND MSG="[SYS] Immediate post-print filament cut (standalone)..."
        CUT_FILAMENT_1
        SET_GCODE_VARIABLE MACRO=_TEARDOWN_CUT_FILAMENT VARIABLE=cut_performed VALUE=1
    {% endif %}


[gcode_macro _TEARDOWN_MMU_UNLOAD]
description: Unloads MMU filament at trash chute without redundant secondary cutting
gcode:
    {% set is_cancel = params.IS_CANCEL|default(0)|int %}
    {% set unload = params.UNLOAD|default(0)|int %}
    {% set cut_done = printer["gcode_macro _TEARDOWN_CUT_FILAMENT"].cut_performed|default(0)|int %}

    MOVE_TO_TRASH
    M400

    {% if printer.mmu.enabled %}
        {% if is_cancel %}
            {% if unload == 1 %}
                {% if cut_done == 1 %}
                    MMU_UNLOAD SKIP_TIP=1 RESTORE=0
                {% else %}
                    MMU_UNLOAD RESTORE=0
                {% endif %}
            {% endif %}
            MMU_PRINT_END STATE=cancelled
        {% else %}
            {% if cut_done == 1 %}
                MMU_UNLOAD SKIP_TIP=1 RESTORE=0
            {% else %}
                MMU_UNLOAD RESTORE=0
            {% endif %}
            MMU_PRINT_END STATE=complete
        {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TEARDOWN_CUT_FILAMENT VARIABLE=cut_performed VALUE=0
    SET_GCODE_VARIABLE MACRO=_CUSTOM_PRE_UNLOAD_ACTION VARIABLE=retraction_applied VALUE=0

[gcode_macro _TEARDOWN_COOLDOWN_AND_SHUTDOWN]
variable_cooldown_cutoff: 150.0
gcode:
    {% set is_cancel = params.IS_CANCEL|default(0)|int %}

    # 1. Resolve Material Identity
    {% set raw_fil = params.FILAMENT|default(params.FILAMENT_TYPE|default(''))|string|upper %}
    {% if raw_fil == '' and printer.mmu is defined and printer.mmu.enabled and printer.mmu.tool >= 0 %}
        {% set raw_fil = printer.mmu.gate_material[printer.mmu.tool]|default('')|string|upper %}
    {% endif %}
    {% if raw_fil == '' %}
        {% set raw_fil = printer.save_variables.variables.last_filament_type|default('UNKNOWN')|string|upper %}
    {% endif %}

    # 2. Map Material to Wiper Polish Temp & Anti-Ooze Cutoff
    {% if 'PPS' in raw_fil %}
        {% set wipe_temp = 250 %}
        {% set cutoff_temp = 190 %}
    {% elif 'PA' in raw_fil or 'NYLON' in raw_fil %}
        {% set wipe_temp = 220 %}
        {% set cutoff_temp = 170 %}
    {% elif 'PC' in raw_fil %}
        {% set wipe_temp = 210 %}
        {% set cutoff_temp = 165 %}
    {% elif 'ABS' in raw_fil or 'ASA' in raw_fil %}
        {% set wipe_temp = 190 %}
        {% set cutoff_temp = 150 %}
    {% elif 'PET' in raw_fil %}
        {% set wipe_temp = 175 %}
        {% set cutoff_temp = 140 %}
    {% else %}
        {% set wipe_temp = 160 %}
        {% set cutoff_temp = 130 %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_TEARDOWN_COOLDOWN_AND_SHUTDOWN VARIABLE=cooldown_cutoff VALUE={cutoff_temp}
    M104 S0

    # 3. Phase 1: Fan-Assisted Drop to Wiper Polish Temp at X91
    {% if 'xyz' in printer.toolhead.homed_axes %}
        M400
        MOVE_TO_TRASH X=91 Y=288 F=6000

        {% if printer.extruder.temperature > wipe_temp %}
            RESPOND MSG="[CAL] Fan cooling nozzle to {wipe_temp}C for clean silicone polish..."
            M106 S255
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={wipe_temp + 1}
        {% endif %}

        # 4. Phase 2: Kill fan during mechanical wipe
        M106 S0
        M400

        G1 X108 F6000
        {% for i in range(4) %}
            G1 X115 F5000
            G1 X101 F5000
        {% endfor %}
        {% for i in range(5) %}
            G1 X122 F5000
            G1 X94  F5000
        {% endfor %}

        # High-speed flick back to chute center void
        G1 X91 F12000
        EXIT_TRASH_CORRIDOR
        M400
    {% endif %}

    # 5. Thermal & Auxiliary Fan Teardown
    BED_MESH_CLEAR
    M140 S0
    M141 S0
    {% if printer['gcode_macro DISABLE_BOX_HEATER'] is defined %}
        DISABLE_BOX_HEATER
    {% endif %}
    {% if printer['fan_generic auxiliary_cooling_fan'] is defined %}
        SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0
    {% endif %}

    # 6. Phase 3: Resume Fan-Assist Down to Anti-Ooze Cutoff in Background
    {% if printer.extruder.temperature > cutoff_temp %}
        RESPOND MSG="[SYS] Resuming part fan cooling down to {cutoff_temp}C..."
        M106 S255
        UPDATE_DELAYED_GCODE ID=_COOLDOWN_FAN_MONITOR DURATION=2
    {% else %}
        M106 S0
    {% endif %}

    # 7. Release Stepper Holding Current
    M400
    M84
    RESPOND MSG="[SYS] Teardown complete. Steppers disabled."

[delayed_gcode HOTEND_COOLDOWN_FAN_OFF]
gcode:
    M106 S0
    RESPOND MSG="[SYS] Part fan off."


[delayed_gcode CHAMBER_FAN_OFF]
gcode:
    SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
    RESPOND MSG="[SYS] Chamber circulation fan cooldown timer complete."



# ------------------------------------------------------------------------------
# PAUSE & RESUME MODULES
# ------------------------------------------------------------------------------
[gcode_macro _PAUSE_PARK]
gcode:
    {% set z_hop = params.Z_HOP|float %}
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-10.0 F1800
    {% endif %}

    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% if (cur_z + z_hop) < max_z %}
        G91
        G1 Z{z_hop} F900
        G90
    {% endif %}

    MOVE_TO_TRASH
    M400
    
    SET_IDLE_TIMEOUT TIMEOUT=7200
    RESPOND MSG="[SYS] Print paused. Toolhead parked over chute."

[gcode_macro _RESUME_RECOVER]
gcode:
    {% set etemp = params.ETEMP|float %}
    
    # 1. Reheat if necessary
    {% if etemp > 0 and printer.extruder.temperature < (etemp - 2.0) %}
        RESPOND MSG="[SYS] Reheating nozzle to {etemp|int}C..."
        M109 S{etemp|int}
    {% endif %}

    # 2. Unretract 10mm when resuming for printing
    {% if etemp >= 180.0 %}
        M83
        G1 E10.0 F1200
        SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=load_retracted_10mm VALUE=0
        RESPOND MSG="[SYS] Deretracted 10mm on print resume."
    {% else %}
        RESPOND MSG="[WARN] Target temp too low. Skipping unretract."
    {% endif %}



# =============================================================================
# MODULAR NOZZLE CLEANING SUITE (FULLY DECOUPLED STAGES)
# =============================================================================

# =============================================================================
# MODULAR NOZZLE CLEANING SUITE (SEAMLESS DIRECT TRANSIT)
# =============================================================================

[gcode_macro CLEAN_STAGE_SILICONE_WIPE]
description: Stage 1 - Wiper blade polish and string severing at wipe_temp
gcode:
    {% set park_corridor = params.PARK_CORRIDOR|default(1)|int %}
    {% set raw_wipe = params.WIPE_TEMP|default(printer["gcode_macro _PRINT_VARS"].wipe_temp|default(0))|int %}
    {% set raw_tap  = params.TAP_TEMP|default(printer["gcode_macro _PRINT_VARS"].tap_temp|default(0))|int %}

    # Use material-specific dynamic thermal profile values (super-smart fallback for standalone execution)
    {% set wipe_temp = raw_wipe if raw_wipe > 0 else (150 if printer.extruder.target < 225 and printer.extruder.target > 0 else 170) %}
    {% set tap_temp  = raw_tap  if raw_tap  > 0 else (130 if printer.extruder.target < 225 and printer.extruder.target > 0 else 145) %}

    # Station 1 Coordinates (Kept 100% as tuned)
    {% set chute_x = 91.0 %}
    {% set chute_y = 288.0 %} #285
    {% set blade_x = 108.0 %}
    {% set blade_y = 288.0 %} #285
    {% set blade_z = 5.0 %}
    {% set ready_z = 5.0 %}
    {% set safe_z  = 5.0 %}
    {% set corridor_y = 271.0 %}

    G90
    # Safety Z-lift
    {% if "z" in printer.toolhead.homed_axes %}
        {% if printer.toolhead.position.z < ready_z %}
            G1 Z{ready_z} F1200
        {% endif %}
    {% endif %}

    # Corridor Ingress: Safely navigate to trash chute void (Zero brim impact)
    MOVE_TO_TRASH X={chute_x} Y={chute_y} F=12000

    # 1. Thermal conditioning: Fan-assisted drop to wiper polish temp over chute
    {% if printer.extruder.temperature > (wipe_temp + 1) %}
        RESPOND MSG="[CAL] Fan cooling nozzle to {wipe_temp}C for clean silicone polish..."
        M104 S{wipe_temp}
        M106 S255
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={wipe_temp + 1}
    {% elif printer.extruder.temperature < (wipe_temp - 2) %}
        M106 S0
        M104 S{wipe_temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={wipe_temp - 2}
    {% endif %}

    # 2. Kill fan during mechanical wipe (prevents nozzle over-cooling/rock-hard drag)
    M106 S0
    M400
    M204 S5000

    # Move from chute void directly across to wiper blade and lower
    G1 X{blade_x} Y{blade_y} F6000
    G1 Z{blade_z} F600

    # Tight center passes across blade
    {% for i in range(4) %}
        G1 X115 Y{blade_y} F5000
        G1 X101 Y{blade_y} F5000
    {% endfor %}

    # Wide sweeps across blade
    {% for i in range(5) %}
        G1 X122 Y{blade_y} F5000
        G1 X94  Y{blade_y} F5000
    {% endfor %}

    # Snap back to chute center void to drop strings into bucket
    G1 X{chute_x} Y{blade_y} F12000
    M400

    # Retract flick away from wiper blade towards Station 2 (maintains wipe_temp through Phase 2 & 3)
    G1 X125 Y{blade_y} F15000

    # Pre-position Z ready for Phase 2 (eliminates large bed elevator rise)
    G1 Z{ready_z} F1200

    # Standalone exit: only pull forward to Y271 if standalone
    {% if park_corridor == 1 %}
        G1 Z{safe_z} F1200
        G1 Y{corridor_y} F6000
    {% endif %}
    M400


[gcode_macro CLEAN_STAGE_BED_BUFF]
description: Stage 2 - Build plate contact buff (original factory spec)
gcode:
    {% set park_corridor = params.PARK_CORRIDOR|default(1)|int %}

    # Station 2 Coordinates (Self-contained)
    {% set p2_start_x = 130.0 %}
    {% set p2_max_x   = 140.0 %}
    {% set p2_y_base  = 280.0 %}
    {% set p2_y_mid   = 281.0 %}
    {% set p2_y_deep  = 283.0 %}
    {% set p2_z_depth = -0.05 %}
    {% set p2_lift_z  = 5.0 %}
    {% set corridor_y = 271.0 %}
    {% set clear_y    = 267.0 %}

    G90
    # Safety Z check: ensure at least safe clearance before transit
    {% if "z" in printer.toolhead.homed_axes %}
        {% if printer.toolhead.position.z < p2_lift_z %}
            G1 Z{p2_lift_z} F1200
        {% endif %}
    {% endif %}

    # Corridor Ingress (only if not already in Station 1/2 transit corridor)
    {% set cur_x = printer.toolhead.position.x|float %}
    {% set cur_y = printer.toolhead.position.y|float %}
    {% if cur_y >= clear_y and (cur_x < 120.0 or cur_x > 145.0) %}
        G1 Y{clear_y} F6000
        G1 X{p2_start_x} Y{clear_y} F12000
        G1 Y{corridor_y} F8000
    {% elif cur_y < clear_y %}
        G1 X{p2_start_x} Y{clear_y} F12000
        G1 Y{corridor_y} F8000
    {% endif %}

    # Move directly to start position at ready Z
    G1 X{p2_start_x} Y{p2_y_base} F8000

    # Lower directly into contact with build plate flange (-0.12mm)
    G1 Z{p2_z_depth} F600

    # Factory circular swirls and linear scrub passes
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G1 X{p2_max_x} F200
    G1 Y{p2_y_mid} F200
    G1 X{p2_start_x} F200
    G1 Y{p2_y_deep} F200
    G1 X{p2_max_x} F200
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    # Lift 5mm to clear bed before Phase 3 transit
    G1 Z{p2_lift_z} F1200

    # Standalone exit: only pull forward to Y271 if standalone
    {% if park_corridor == 1 %}
        G1 Y{corridor_y} F6000
    {% endif %}
    M400


[gcode_macro CLEAN_STAGE_GREY_BRUSH]
description: Stage 3 - Deep brush cleaning in sunken rear pocket (Bounded X163-X182)
gcode:
    {% set park_corridor = params.PARK_CORRIDOR|default(1)|int %}

    # Station 3 Coordinates (Self-contained)
    {% set brush_center_x = 173.5 %}
    {% set brush_min_x    = 163.0 %}
    {% set brush_max_x    = 182.0 %}
    {% set brush_y        = 285.0 %}
    {% set brush_z_depth  = -1.5 %}
    {% set transit_z      = 5.0 %}
    {% set exit_z         = 10.0 %}
    {% set corridor_y     = 271.0 %}
    {% set clear_y        = 267.0 %}

    G90
    # Ensure at least 5mm transit clearance
    {% if "z" in printer.toolhead.homed_axes %}
        {% if printer.toolhead.position.z < transit_z %}
            G1 Z{transit_z} F1200
        {% endif %}
    {% endif %}

    # Corridor Ingress (only if not already in rear shelf from Stage 2)
    {% set cur_x = printer.toolhead.position.x|float %}
    {% set cur_y = printer.toolhead.position.y|float %}
    {% if cur_y >= clear_y and (cur_x < 125.0 or cur_x > 185.0) %}
        G1 Y{clear_y} F6000
        G1 X{brush_center_x} Y{clear_y} F12000
        G1 Y{corridor_y} F8000
    {% elif cur_y < clear_y %}
        G1 X{brush_center_x} Y{clear_y} F12000
        G1 Y{corridor_y} F8000
    {% endif %}

    # Direct transit to grey brush cavity at safe 5mm Z
    G1 X{brush_center_x} Y{brush_y} F8000
    M400

    # Lower nozzle into sunken grey brush bristles
    G1 Z{brush_z_depth} F600

    # Scrub passes along verified brush span (X163 <-> X182)
    {% for i in range(6) %}
        G1 X{brush_min_x} F5000
        G1 X{brush_max_x} F5000
    {% endfor %}

    # Ascend straight UP out of sunken pocket
    G1 Z{exit_z} F1200

    # Pull forward to corridor boundary (default behavior)
    {% if park_corridor == 1 %}
        G1 Y{corridor_y} F6000
    {% endif %}
    M400


[gcode_macro _DUAL_CLEANING]
description: Master orchestrator executing all 3 stages in continuous transit
gcode:
    RESPOND MSG="[SYS] Starting 3-stage cleaning cycle..."
    # Continuous direct transit between stages (bypass Y271 detours)
    CLEAN_STAGE_SILICONE_WIPE PARK_CORRIDOR=0
    CLEAN_STAGE_BED_BUFF PARK_CORRIDOR=0
    # Final stage parks at Y271 on completion
    CLEAN_STAGE_GREY_BRUSH PARK_CORRIDOR=1
    RESPOND MSG="[SYS] All cleaning stages complete."
