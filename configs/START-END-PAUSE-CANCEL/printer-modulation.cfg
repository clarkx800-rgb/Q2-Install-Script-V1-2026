# ==============================================================================
# PRINTER MODULATION (Core Commands & Overrides)
# File: printer-modulation.cfg
# ==============================================================================

[gcode_macro PRINTER_PARAM]
description: Hardware boundary constants for Qidi Q2
variable_max_x: 270.0
variable_max_y: 270.0
variable_max_z: 260.0
variable_max_x_position: 270.0
variable_max_y_position: 270.0
variable_max_z_position: 260.0
variable_chute_x: 91.0
variable_chute_y: 288.0
variable_chute_corridor_y: 271.0
variable_clear_x_position: 125.0
variable_clear_y_position: 288.0
variable_cutter_pin_x: 15.0
variable_cutter_pin_y: 0.5
variable_cutter_stroke_x: -0.5
gcode:

[gcode_macro DISABLE_ALL_SENSOR]
description: Flush toolhead sensor queue during MMU shifts
gcode:
    M400

[gcode_macro ENABLE_ALL_SENSOR]
description: Re-engage runout and toolhead monitoring
gcode:
    M400

[delayed_gcode _INIT_BED_MESH_STATE]
initial_duration: 1.0
gcode:
    {% set mesh_enabled = printer.save_variables.variables.enable_bed_mesh|default(1)|int %}
    {% if 'output_pin Bed_Mesh' in printer %}
        SET_PIN PIN=Bed_Mesh VALUE={mesh_enabled}
    {% endif %}
    {% if 'gcode_macro TOGGLE_BED_MESH' in printer %}
        SET_GCODE_VARIABLE MACRO=TOGGLE_BED_MESH VARIABLE=enable_mesh VALUE={mesh_enabled}
    {% endif %}

[gcode_macro G29]
description: Clears active bed mesh and runs Klipper native adaptive bed calibration without redundant homing.
variable_k: 1
gcode:
    BED_MESH_CLEAR
    SET_STEPPER_ENABLE STEPPER=extruder enable=0
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if k|int == 1 %}
        BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5 PROFILE=adaptive       
        SAVE_VARIABLE VARIABLE=profile_name VALUE='"adaptive"'
        G4 P2000
    {% else %}
        {% if "default" in printer.bed_mesh.profiles %}
            BED_MESH_PROFILE LOAD=default
            SAVE_VARIABLE VARIABLE=profile_name VALUE='"default"'
        {% elif "kamp" in printer.bed_mesh.profiles %}
            BED_MESH_PROFILE LOAD=kamp
            SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
        {% elif "adaptive" in printer.bed_mesh.profiles %}
            BED_MESH_PROFILE LOAD=adaptive
            SAVE_VARIABLE VARIABLE=profile_name VALUE='"adaptive"'
        {% else %}
            BED_MESH_CALIBRATE PROFILE=default
            SAVE_VARIABLE VARIABLE=profile_name VALUE='"default"'
            G4 P2000
            SAVE_CONFIG
        {% endif %}
    {% endif %}

[gcode_macro TOGGLE_BED_MESH]
description: Toggle adaptive bed mesh generation in PRINT_START on or off
variable_enable_mesh: 1
gcode:
    {% set pin_state = printer['output_pin Bed_Mesh'].value|int if 'output_pin Bed_Mesh' in printer else 1 %}
    {% set current_state = printer.save_variables.variables.enable_bed_mesh|default(pin_state)|int %}
    {% if current_state == 1 %}
        DISABLE_BED_MESH_CALIBRATION
    {% else %}
        ENABLE_BED_MESH_CALIBRATION
    {% endif %}

[gcode_macro ENABLE_BED_MESH_CALIBRATION]
description: Enables Klipper native adaptive bed mesh probing before prints
gcode:
    SAVE_VARIABLE VARIABLE=enable_bed_mesh VALUE=1
    SET_GCODE_VARIABLE MACRO=TOGGLE_BED_MESH VARIABLE=enable_mesh VALUE=1
    {% if 'output_pin Bed_Mesh' in printer %}
        SET_PIN PIN=Bed_Mesh VALUE=1
    {% endif %}
    RESPOND MSG="[CAL] Bed mesh probing enabled"

[gcode_macro ENABLE_BED_MESH]
description: Alias for ENABLE_BED_MESH_CALIBRATION
gcode:
    ENABLE_BED_MESH_CALIBRATION

[gcode_macro DISABLE_BED_MESH_CALIBRATION]
description: Disables adaptive mesh probing; loads saved default profile instead
gcode:
    SAVE_VARIABLE VARIABLE=enable_bed_mesh VALUE=0
    SET_GCODE_VARIABLE MACRO=TOGGLE_BED_MESH VARIABLE=enable_mesh VALUE=0
    {% if 'output_pin Bed_Mesh' in printer %}
        SET_PIN PIN=Bed_Mesh VALUE=0
    {% endif %}
    RESPOND MSG="[CAL] Bed mesh probing disabled (will load saved profile)"

[gcode_macro DISABLE_BED_MESH]
description: Alias for DISABLE_BED_MESH_CALIBRATION
gcode:
    DISABLE_BED_MESH_CALIBRATION

[gcode_macro SKIP_BED_MESH]
description: Alias to skip bed mesh probing before prints
gcode:
    DISABLE_BED_MESH_CALIBRATION

[gcode_macro save_zoffset]
description: Internal macro to safely save the global Z-offset variable.
gcode:
    {% if printer.gcode_move.homing_origin.z < 0.5 %}
       SAVE_VARIABLE VARIABLE=z_offset VALUE={printer.gcode_move.homing_origin.z}
    {% endif %}

[gcode_macro set_zoffset]        
description: Internal macro to apply the global saved Z-offset to the current state.
gcode:
    {% set z = printer.save_variables.variables.z_offset|default(0) %}
    SET_GCODE_OFFSET Z={z} MOVE=0

[gcode_macro G31]
description: Internal variable setter for G29 mesh sequence (Enable mesh).
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=1
    SET_GCODE_VARIABLE MACRO=TOGGLE_BED_MESH VARIABLE=enable_mesh VALUE=1
    {% if 'output_pin Bed_Mesh' in printer %}
        SET_PIN PIN=Bed_Mesh VALUE=1
    {% endif %}

[gcode_macro G32]
description: Internal variable setter for G29 mesh sequence (Skip mesh).
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=0
    SET_GCODE_VARIABLE MACRO=TOGGLE_BED_MESH VARIABLE=enable_mesh VALUE=0
    {% if 'output_pin Bed_Mesh' in printer %}
        SET_PIN PIN=Bed_Mesh VALUE=0
    {% endif %}

[gcode_macro M290]
description: Adjusts the Z-offset dynamically during printing (Babystepping).
gcode:
   SET_GCODE_OFFSET Z_ADJUST={params.Z}

[gcode_macro M4029]
description: Initializes bed mesh calibration routines.
gcode:
    {% set bedtemp = params.S|default(60)|float %}
    DISABLE_ALL_SENSOR
    M104 S140
    M140 S{bedtemp}
    SAVE_VARIABLE VARIABLE=z_offset VALUE=0
    SET_GCODE_OFFSET Z=0 MOVE=0
    M4031
    G28 
    M400
    CLEAR_NOZZLE HOTEND=260
    M104 S140
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=140
    Z_TILT_ADJUST
    G28
    G1 z10 F600
    BED_MESH_CALIBRATE
    G0 Z50 F600
    G0 X130 Y130 F9000
    M400
    SAVE_CONFIG

[gcode_macro M4030]
description: Executes a manual bed tramming prep routine.
gcode:    
    BED_MESH_CLEAR      
    SET_GCODE_OFFSET Z=0 MOVE=0
    M4031
    G28
    G1 X240 Y32 F9000
    G28 Z
    G1 Z0 F600

[gcode_macro M4031]
description: Temporarily lowers motor currents for safe physical calibration limits.
gcode:
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={printer.configfile.settings['tmc2209 stepper_z'].run_current * 0.8 }
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={printer.configfile.settings['tmc2209 stepper_z1'].run_current * 0.8 }
    REVERSE_HOMING
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={printer.configfile.settings['tmc2209 stepper_z'].run_current}
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={printer.configfile.settings['tmc2209 stepper_z1'].run_current}
    G91
    G1 Z-30 F600
    G90
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={printer.configfile.settings['tmc2209 stepper_z'].run_current * 0.8 }
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={printer.configfile.settings['tmc2209 stepper_z1'].run_current * 0.8 }
    REVERSE_HOMING
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={printer.configfile.settings['tmc2209 stepper_z'].run_current}
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={printer.configfile.settings['tmc2209 stepper_z1'].run_current}
    G91
    G1 Z-30 F600
    G90

[gcode_macro move_screw1]
gcode:
    G1 Z5 F600
    G1 X30 Y32 F12000
    G1 Z0 F300

[gcode_macro move_screw2]
gcode:
    G1 Z5 F600
    G1 X240 Y32 F12000
    G1 Z0 F300
    
[gcode_macro move_screw3]
gcode:
    G1 Z5 F600
    G1 X240 Y242 F12000
    G1 Z0 F300

[gcode_macro move_screw4]
gcode:
    G1 Z5 F600
    G1 X30 Y242 F12000
    G1 Z0 F300

# Stock Klipper M140 and M190 restored (no overrides)

[gcode_macro M104]
description: Overrides M104 to support multi-material slicers (MMU) with a single physical extruder
rename_existing: M99104
gcode:
    {% if 'S' in params %}
        {% set s = params.S|float %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={s}
    {% endif %}

[gcode_macro M109]
description: Sets hotend temperature and actively waits for stabilization without console noise.
rename_existing: M99109
variable_skip_wait: False
gcode:
    {% set s = params.S|default(0)|float %}
    {% if 'S' in params %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={s}
    {% endif %}
    {% if s != 0 and not printer["gcode_macro M109"].skip_wait %}
        {% if printer.extruder.temperature < s %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s}
        {% else %}
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={s+3}
        {% endif %}
    {% endif %}

[gcode_macro M141]
description: Sets the chamber heater target temperature (Max 65C).
gcode:
    {% if printer["heater_generic chamber"] is defined %}
        {% set s = params.S|default(0)|float %} 
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={([s, 65]|min)}
    {% endif %}

[gcode_macro M191]
description: Sets chamber target and turns on circulation fan without stalling the printer
gcode:
    {% set s = params.S|default(0)|float %}
    {% if s > 0 %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={([s, 65]|min)}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0.8
        RESPOND MSG="[SYS] Chamber preheat engaged: {s|int}C (Circulation 80%)"
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
    {% endif %}

[gcode_macro M106]
description: Controls various fans based on P parameter.
gcode:
    {% set p = params.P|default(0)|int %}
    {% if p == 2 and printer["fan_generic auxiliary_cooling_fan"] is defined %}
        {% if params.S is defined %}
            SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED={(params.S|float / 255.0)}
        {% else %}
            SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=1
        {% endif %}
    {% endif %} 
    {% if p == 0 and printer["fan_generic cooling_fan"] is defined %}
        {% if params.S is defined %}
            SET_FAN_SPEED FAN=cooling_fan SPEED={(params.S|float / 255.0)}
        {% else %}
            SET_FAN_SPEED FAN=cooling_fan SPEED=1
        {% endif %}
    {% endif %} 
    {% if p == 3 and printer["fan_generic chamber_circulation_fan"] is defined %}
        {% if params.S is defined %}
            SET_FAN_SPEED FAN=chamber_circulation_fan SPEED={(params.S|float / 255.0)}
        {% else %}
            SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=1
        {% endif %}
    {% endif %} 
    {% if p == 4 and printer["output_pin Polar_cooler"] is defined %}
        {% if params.S is defined %}
            SET_PIN PIN=Polar_cooler VALUE={1 if (params.S|int / 255) > 0 else 0}
        {% else %}
            SET_PIN PIN=Polar_cooler VALUE=1
        {% endif %}
    {% endif %}

[gcode_macro M107]
description: Turns off fans based on P parameter (P0 part cooling, P2 auxiliary, P3 chamber circulation, P4 polar cooler).
gcode:
    {% set p = params.P|default(0)|int %}
    {% if p == 0 and printer["fan_generic cooling_fan"] is defined %}
        SET_FAN_SPEED FAN=cooling_fan SPEED=0
    {% elif p == 2 and printer["fan_generic auxiliary_cooling_fan"] is defined %}
        SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0
    {% elif p == 3 and printer["fan_generic chamber_circulation_fan"] is defined %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
    {% elif p == 4 and printer["output_pin Polar_cooler"] is defined %}
        SET_PIN PIN=Polar_cooler VALUE=0
    {% else %}
        {% if printer["fan_generic cooling_fan"] is defined %}
            SET_FAN_SPEED FAN=cooling_fan SPEED=0
        {% endif %}
    {% endif %}

[gcode_macro M84]
description: Disables stepper motors while respecting axis exclusions (holds Z if specified)
rename_existing: M84.1
gcode:
    {% if 'Z' in params %}
        SET_STEPPER_ENABLE STEPPER=stepper_z enable=0
        SET_STEPPER_ENABLE STEPPER=stepper_z1 enable=0
    {% endif %}
    {% if 'X' in params or 'Y' in params or ('X' not in params and 'Y' not in params and 'Z' not in params and 'E' not in params) %}
        SET_STEPPER_ENABLE STEPPER=stepper_x enable=0
        SET_STEPPER_ENABLE STEPPER=stepper_y enable=0
    {% endif %}
    {% if 'E' in params or ('X' not in params and 'Y' not in params and 'Z' not in params and 'E' not in params) %}
        SET_STEPPER_ENABLE STEPPER=extruder enable=0
    {% endif %}
    M84.1 {% for p in params %}{'%s%s ' % (p, params[p])}{% endfor %}

[gcode_macro LED_ON]
description: Turns ON the internal enclosure lighting.
gcode:
    SET_PIN PIN=caselight VALUE=1

[gcode_macro LED_OFF]
description: Turns OFF the internal enclosure lighting.
gcode:
    SET_PIN PIN=caselight VALUE=0

[gcode_macro BEEP]
description: Sounds the hardware beeper based on parameters.
gcode:
    {% set i = params.I|default(1)|int %}
    {% set dur = params.DUR|default(100)|int %}
    {% set beep = printer.save_variables.variables.beep|default(0) %}
    {% if beep == 1 %}
        {% for iteration in range(i|int) %}
            SET_PIN PIN=beeper VALUE=1
            G4 P{dur}
            SET_PIN PIN=beeper VALUE=0
            G4 P{dur}
        {% endfor %}
    {% endif %}

[gcode_macro beep_on]
description: Enables system sounds and beeps.
gcode:
    SAVE_VARIABLE VARIABLE=beep VALUE=1

[gcode_macro beep_off]
description: Disables system sounds and beeps.
gcode:
    SAVE_VARIABLE VARIABLE=beep VALUE=0

[gcode_macro AUTOTUNE_SHAPERS]
description: Kalico shaper profile selector. Applies tuned shaper types dynamically.
variable_autotune_shapers: 'smooth_mzv'
gcode:
    {% set shaper = params.SHAPER|default(autotune_shapers)|string %}
    SET_INPUT_SHAPER SHAPER_TYPE_X={shaper} SHAPER_TYPE_Y={shaper}
    RESPOND MSG="[CAL] Input Shaper: {shaper}"

[gcode_macro SHAPER_CALIBRATE]
description: Initiates a Kalico resonance sweep with safe frequency bounds and auto-scoring.
rename_existing: RESHAPER_CALIBRATE
gcode:
    {% set axis = params.AXIS|default('ALL')|string|upper %}
    {% set f_start = params.FREQ_START|default(20)|int %}
    {% set f_end = params.FREQ_END|default(125)|int %}
    {% if axis == 'ALL' %}
        RESPOND MSG="[CAL] Resonance sweep X & Y ({f_start}-{f_end}Hz)"
        RESHAPER_CALIBRATE AXIS=x FREQ_START={f_start} FREQ_END={f_end}
        RESHAPER_CALIBRATE AXIS=y FREQ_START={f_start} FREQ_END={f_end}
    {% else %}
        RESPOND MSG="[CAL] Resonance sweep {axis} ({f_start}-{f_end}Hz)"
        RESHAPER_CALIBRATE AXIS={axis|lower} FREQ_START={f_start} FREQ_END={f_end}
    {% endif %}

[gcode_macro M901]
description: Full automated Kalico Input Shaper calibration routine with safety positioning.
gcode:
    M104 S0
    M140 S0
    M106 S0
    M400
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G0 X135 Y135 Z50 F12000
    M400
    RESPOND MSG="[CAL] Commencing Input Shaper sweep"
    SHAPER_CALIBRATE AXIS=ALL FREQ_START=20 FREQ_END=130
    SAVE_CONFIG

[gcode_macro DETECT_INTERRUPTION]
description: Checks for power loss or unexpected resets on startup.
gcode:
    {% set was_interrupted = printer.save_variables.variables.was_interrupted %}
    {% if was_interrupted %}
    RESPOND MSG="[WARN] Unexpected power loss detected on last print. Resume: RESUME_INTERRUPTED | Clear: CLEAR_LAST_FILE"
    {% endif %}

[delayed_gcode PRINTER_INIT]
initial_duration:0.2
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_z enable=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 enable=1
    BED_MESH_CLEAR      
    DISABLE_ALL_SENSOR

[gcode_macro M303]
description: Initiates PID tuning for the hotend or heated bed.
gcode:
    {% if params.E is defined and params.S is defined %}
        {% if (params.E|int)==-1 %} 
            PID_CALIBRATE HEATER=heater_bed TARGET={params.S|int}
        {% endif %}
        {% if (params.E|int)==0 %}
            PID_CALIBRATE HEATER=extruder TARGET={params.S|int}
        {% endif %}
    {% endif %}

[gcode_macro M900]
description: Sets Pressure Advance (K) and Smooth Time (T).
gcode:
    {% if params.K is defined %} 
        SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}  
    {% if params.T is defined %}    
        SET_PRESSURE_ADVANCE SMOOTH_TIME={params.T}
    {% endif %} 

[gcode_macro M0]
description: Pauses the print job (Alias for PAUSE).
gcode:
    PAUSE

[gcode_macro M25]
description: Pauses the print job (Alias for PAUSE).
rename_existing: M9925
gcode:
    PAUSE

[gcode_macro M204]
description: Dynamically sets printing and travel accelerations.
rename_existing: M99204
gcode:
    {% if params.S is defined %}
        {% set s = params.S|float %}
    {% endif %}
    {% if params.P is defined and params.T is defined %}
        {% set s = [params.P|float ,params.T|float] | min %}
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL={s}
    SET_VELOCITY_LIMIT ACCEL_TO_DECEL={s/2}

[gcode_macro PRIME_LINE]
description: Executes the custom volumetric 2-line purge on the build plate.
gcode:
    {% set initial_layer_height = params.INITIAL_LAYER_HEIGHT|default(0.2)|float %}
    {% set outer_wall_volumetric_speed = params.VOLUMETRIC_SPEED|default(15)|float %}
    G92 E0
    G1 X108.000 Y1 F30000
    G0 Z{initial_layer_height} F600
    G90
    M83
    {% if printer["gcode_macro _PRINT_VARS"].load_retracted_10mm|default(0)|int == 1 %}
        G1 E8.0 F1200
        SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=load_retracted_10mm VALUE=0
        RESPOND MSG="[SYS] Deretracted 8mm for prime line."
    {% endif %}
    G0 X128 E8 F{outer_wall_volumetric_speed/(24/20) * 60}
    G0 X133 E0.3742 F{outer_wall_volumetric_speed/(0.3*0.5)/4 * 60}
    G0 X138 E0.3742 F{outer_wall_volumetric_speed/(0.3*0.5) * 60}
    G0 X143 E0.3742 F{outer_wall_volumetric_speed/(0.3*0.5)/4 * 60}
    G0 X148 E0.3742 F{outer_wall_volumetric_speed/(0.3*0.5) * 60}
    G0 X153 E0.3742 F{outer_wall_volumetric_speed/(0.3*0.5) * 60}
    G91
    G1 X1 Z-0.300
    G1 X4
    G1 Z1 F1200
    G90
    M400
    G1 X108.000 Y2.5 F30000
    G0 Z{initial_layer_height} F600
    M83
    G0 X128 E10 F{outer_wall_volumetric_speed/(24/20) * 60}
    G0 X133 E0.3742 F{outer_wall_volumetric_speed/(0.3*0.5)/4 * 60}
    G0 X138 E0.3742 F{outer_wall_volumetric_speed/(0.3*0.5) * 60}
    G0 X143 E0.3742 F{outer_wall_volumetric_speed/(0.3*0.5)/4 * 60}
    G0 X148 E0.3742 F{outer_wall_volumetric_speed/(0.3*0.5) * 60}
    G0 X153 E0.3742 F{outer_wall_volumetric_speed/(0.3*0.5) * 60}
    G91
    G1 X1 Z-0.300
    G1 X4
    G1 Z1 F1200
    G90
    G1 Z1 F600



[gcode_macro BOX_TEMPERATURE]
description: Set box dryer temperature in °C (0 to turn off)
gcode:
    {% set temp = params.TEMP|default(50)|int %}
    {% if temp <= 0 %}
        STOP_BOX_DRYER
    {% else %}
        START_BOX_DRYER TEMP={temp}
    {% endif %}

[gcode_macro START_BOX_DRYER]
description: Start filament drying with active thermal core guard and ambient regulation
variable_chamber_target: 0
variable_max_core_temp: 68
gcode:
    # Desired air drying target inside the spool chamber (default 50C, 0 to turn off)
    {% set target = params.TEMP|default(50)|int %}
    # Drying duration in hours (default 8 hours)
    {% set hours = params.HOURS|default(8)|float %}
    {% set default_timeout = printer.configfile.settings.idle_timeout.timeout|default(1500)|int %}

    {% if target <= 0 or hours <= 0 %}
        STOP_BOX_DRYER
    {% else %}
        # Core runs slightly above ambient to transfer heat, capped at 68C
        {% set core_target = [target + 12, 68]|min %}
        {% set duration_sec = (hours * 3600)|int %}

        SET_GCODE_VARIABLE MACRO=START_BOX_DRYER VARIABLE=chamber_target VALUE={target}
        SET_HEATER_TEMPERATURE HEATER=box1_heater TARGET={core_target}

        # Extend printer idle timeout so drying doesn't shut down prematurely after 10-25 mins
        SET_IDLE_TIMEOUT TIMEOUT={duration_sec + 600}

        # Auto safety shutoff timer matching desired hours
        UPDATE_DELAYED_GCODE ID=stop_box_heater DURATION=0
        UPDATE_DELAYED_GCODE ID=stop_box_heater DURATION={duration_sec}
        UPDATE_DELAYED_GCODE ID=box_dryer_monitor DURATION=10

        RESPOND MSG="[DRYER] Started: Target={target}C, Duration={hours}h ({duration_sec}s). Idle timeout extended."
    {% endif %}

[delayed_gcode box_dryer_monitor]
gcode:
    {% set target = printer["gcode_macro START_BOX_DRYER"].chamber_target|float %}
    {% set cur_air = printer["temperature_sensor box1_chamber_humidity"].temperature|default(0)|float %}
    {% set cur_core_target = printer["heater_generic box1_heater"].target|default(0)|float %}

    {% if cur_core_target > 0 and target > 0 %}
        {% if cur_air >= target %}
            # Chamber reached target; throttle core to maintain temperature without overshooting
            {% set hold_temp = [target + 4, 55]|min %}
            SET_HEATER_TEMPERATURE HEATER=box1_heater TARGET={hold_temp}
        {% elif cur_air < (target - 2.0) %}
            # Chamber dipped; re-boost core heating within safety limits
            {% set boost_temp = [target + 12, 68]|min %}
            SET_HEATER_TEMPERATURE HEATER=box1_heater TARGET={boost_temp}
        {% endif %}
        UPDATE_DELAYED_GCODE ID=box_dryer_monitor DURATION=15
    {% endif %}

[delayed_gcode stop_box_heater]
gcode:
    RESPOND MSG="[DRYER] Drying time completed. Turning off heater."
    STOP_BOX_DRYER

[gcode_macro STOP_BOX_DRYER]
description: Safely stop filament dryer and restore default idle timeout
gcode:
    {% set default_timeout = printer.configfile.settings.idle_timeout.timeout|default(1500)|int %}
    SET_GCODE_VARIABLE MACRO=START_BOX_DRYER VARIABLE=chamber_target VALUE=0
    SET_HEATER_TEMPERATURE HEATER=box1_heater TARGET=0
    UPDATE_DELAYED_GCODE ID=stop_box_heater DURATION=0
    UPDATE_DELAYED_GCODE ID=box_dryer_monitor DURATION=0
    SET_IDLE_TIMEOUT TIMEOUT={default_timeout}
    RESPOND MSG="[DRYER] Stopped. Fans will continue running until core drops below 35C. Idle timeout restored ({(default_timeout/60)|int}m)."

[gcode_macro DISABLE_BOX_HEATER]
description: Safely stop filament dryer (compatibility alias)
gcode:
    STOP_BOX_DRYER

[gcode_macro SET_DRYING_IDLE_TIMEOUT]
description: Set printer idle timeout in hours for drying (HOURS=...), or restore default (HOURS=0)
gcode:
    {% set hours = params.HOURS|default(4)|float %}
    {% set default_timeout = printer.configfile.settings.idle_timeout.timeout|default(1500)|int %}
    {% if hours > 0 %}
        {% set sec = (hours * 3600)|int %}
        SET_IDLE_TIMEOUT TIMEOUT={sec}
        RESPOND MSG="[SYS] Idle timeout extended to {hours} hours ({sec}s) for drying."
    {% else %}
        SET_IDLE_TIMEOUT TIMEOUT={default_timeout}
        RESPOND MSG="[SYS] Idle timeout restored to default ({(default_timeout/60)|int} mins)."
    {% endif %}

[gcode_macro RESTORE_IDLE_TIMEOUT]
description: Restore default printer idle timeout (25 mins)
gcode:
    {% set default_timeout = printer.configfile.settings.idle_timeout.timeout|default(1500)|int %}
    SET_IDLE_TIMEOUT TIMEOUT={default_timeout}
    RESPOND MSG="[SYS] Idle timeout restored to default ({(default_timeout/60)|int} mins)."

