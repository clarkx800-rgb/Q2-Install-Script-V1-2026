# ==============================================================================
# MAIN PRINT LIFECYCLE MACROS
# File: start-end-cancel-pause-resume.cfg
# ==============================================================================

[gcode_macro PRINT_START]
description: Master Print Start Controller
gcode:
    CLEAR_PAUSE
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=is_print_start VALUE=1
    SET_GCODE_VARIABLE MACRO=_CUSTOM_PRE_UNLOAD_ACTION VARIABLE=retraction_applied VALUE=0
	M220 S100
    # --- IMMEDIATE FAN SHUTDOWN & TIMER PURGE ---
    M106 S0                                                  # Part cooling fan (P0)
    M106 P2 S0                                               # Auxiliary fan (P2)
    M106 P3 S0                                               # Exhaust / circulation fan (P3)
    UPDATE_DELAYED_GCODE ID=CHAMBER_FAN_OFF DURATION=0      # Cancel legacy cooldown timers
    UPDATE_DELAYED_GCODE ID=HOTEND_COOLDOWN_FAN_OFF DURATION=0
    # ---------------------------------------------

    _CALCULATE_THERMAL_PROFILE BED={params.BED|default(55)} HOTEND={params.HOTEND|default(220)} NEXT_HIGH_TEMP={params.NEXT_HIGH_TEMP|default(230)} CHAMBER={params.CHAMBER|default(0)} EXTRUDER={params.EXTRUDER|default(0)} FILAMENT="{params.FILAMENT|default('')}" FILAMENT_TYPE="{params.FILAMENT_TYPE|default('')}"
    _HEATSOAK_SETUP
    _REFERENCE_HOMING
    _REMNANT_PURGE EXTRUDER={params.EXTRUDER|default(0)}
    _DUAL_CLEANING
    _PROBE_MESH SKIP_BED_MESH={params.SKIP_BED_MESH|default(params.SKIP_MESH|default(-1))} BED_MESH={params.BED_MESH|default(-1)}
    _LAUNCH_PRINT



[gcode_macro PRINT_END]
description: Master Print End Controller
gcode:
	M220 S100
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        RESPOND MSG="[WARN] PRINT_END: Steppers unhomed, bypassing physical teardown"
    {% else %}
        M400
        G92 E0
        
        _TEARDOWN_RETRACT_AND_LIFT
        _TEARDOWN_CUT_FILAMENT
        _RECORD_THERMAL_MEMORY CUR_EXTRUDER={params.CUR_EXTRUDER|default(printer.mmu.tool|default(-1))} FILAMENT_TYPE="{params.FILAMENT_TYPE|default('')}" FILAMENT_NAME="{params.FILAMENT_NAME|default('')}"
        _TEARDOWN_BED_DROP MAX_LAYER_Z={params.MAX_LAYER_Z|default(printer.toolhead.position.z)}
        _TEARDOWN_MMU_UNLOAD
        _TEARDOWN_COOLDOWN_AND_SHUTDOWN
    {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Master Cancel Controller with Full Teardown & Motor Shutdown
variable_is_unloading: 0
gcode:
    M220 S100

    {% if 'xyz' not in printer.toolhead.homed_axes %}
        RESPOND MSG="[WARN] CANCEL_PRINT: Steppers unhomed, bypassing physical teardown"
        BASE_CANCEL_PRINT
    {% else %}
        M400
        save_zoffset
        SET_GCODE_VARIABLE MACRO=CANCEL_PRINT VARIABLE=is_unloading VALUE=1

        # Execute synchronized physical teardown
        _TEARDOWN_RETRACT_AND_LIFT
        _TEARDOWN_CUT_FILAMENT
        _RECORD_THERMAL_MEMORY CUR_EXTRUDER={printer.mmu.tool|default(-1)} IS_CANCEL=1
        _TEARDOWN_BED_DROP IS_CANCEL=1
        _TEARDOWN_MMU_UNLOAD UNLOAD={params.UNLOAD|default(1)} IS_CANCEL=1
        _TEARDOWN_COOLDOWN_AND_SHUTDOWN IS_CANCEL=1

        SET_GCODE_VARIABLE MACRO=CANCEL_PRINT VARIABLE=is_unloading VALUE=0
        BASE_CANCEL_PRINT
    {% endif %}


[gcode_macro PAUSE]
description: Master Pause Controller
rename_existing: BASE_PAUSE
gcode:
    {% set z_hop = params.Z|default(5)|float %}
    
    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z_hop}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_x VALUE={printer.toolhead.position.x}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_y VALUE={printer.toolhead.position.y}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_z VALUE={printer.toolhead.position.z}
        
        SAVE_GCODE_STATE NAME=MY_PRINT_STATE
        BASE_PAUSE
        _PAUSE_PARK Z_HOP={z_hop}
    {% endif %}

[gcode_macro RESUME]
description: Master Resume Controller
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
variable_saved_x: 0.0
variable_saved_y: 0.0
variable_saved_z: 0.0
gcode:
    {% set resume_x = printer["gcode_macro RESUME"].saved_x|float %}
    {% set resume_y = printer["gcode_macro RESUME"].saved_y|float %}
    {% set resume_z = printer["gcode_macro RESUME"].saved_z|float %}
    {% set resume_etemp = printer["gcode_macro RESUME"].etemp|float %}

    {% if printer['pause_resume'].is_paused|int == 1 %}
        _RESUME_RECOVER ETEMP={resume_etemp}
        
        # 1. Silicone wiper wipe over chute void to prevent unretract ooze dragging onto bed
        CLEAN_NOZZLE_FAST
        
        # 2. Step straight forward out of the trash pocket to Y271
        EXIT_TRASH_CORRIDOR
        M400
        
        # 2. Restore modes, feeds, and coordinate systems without moving
        RESTORE_GCODE_STATE NAME=MY_PRINT_STATE MOVE=0
        
        # 3. Stage 1: Move XY directly over print point at current hopped Z height
        G90
        G1 X{resume_x} Y{resume_y} F9000
        M400
        
        # 4. Stage 2: Drop Z down to the exact print layer
        G1 Z{resume_z} F1200
        M400
        
        # 5. Overwrite PAUSE_STATE at current coords so BASE_RESUME does not move
        SAVE_GCODE_STATE NAME=PAUSE_STATE
        
        # 6. Unpause the print stream
        BASE_RESUME VELOCITY=150
        
        RESPOND MSG="[SYS] Print resumed cleanly."
    {% endif %}


# --- QIDI TOUCHSCREEN ALIASES ---
[gcode_macro RESUME_PRINT]
description: Alias for Qidi physical screen
gcode:
    RESUME

[gcode_macro RESUME_1]
description: Alias for Qidi physical screen
gcode:
    RESUME