# ==============================================================================
# QIDI Q2 — Essential Baseline G-Code Macros
# Standard start, end, pause, resume, cancel, and load cell tare
# ==============================================================================

[gcode_macro PRINT_START]
description: Standard Print Start Sequence
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(210)|float %}
    
    CLEAR_PAUSE
    M117 Heating Bed...
    M140 S{BED_TEMP}
    M104 S150                                ; Warm nozzle to safe non-ooze limit for probing
    M190 S{BED_TEMP}                         ; Wait for bed temp
    
    M117 Homing...
    G28                                      ; Home XYZ
    Z_TILT_ADJUST                            ; Align dual Z steppers
    G28 Z                                    ; Re-home Z after tilt adjust
    
    M117 Calibrating Bed Mesh...
    BED_MESH_CALIBRATE                       ; Run bed mesh
    
    M117 Heating Nozzle...
    G1 X10 Y10 Z10 F6000                     ; Move to safe corner
    M109 S{EXTRUDER_TEMP}                    ; Wait for extrusion temp
    
    M117 Printing...

[gcode_macro PRINT_END]
description: Standard Print End Sequence
gcode:
    M400                                     ; Wait for buffer to clear
    G92 E0                                   ; Reset extruder
    G1 E-3.0 F1800                           ; Retract filament 3mm
    
    # Safe Z lift
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 15.0) %}
        G91
        G1 Z10 F3000
        G90
    {% else %}
        G90
        G1 Z{max_z} F3000
    {% endif %}
    
    # Park at rear
    G90
    G1 X10 Y260 F6000
    
    # Turn off heaters and part cooling fan
    M104 S0
    M140 S0
    M141 S0
    M106 S0
    M84                                      ; Disable steppers
    M117 Print Finished!

[gcode_macro PAUSE]
description: Pause Current Print
rename_existing: BASE_PAUSE
gcode:
    {% set z = params.Z|default(10)|float %}
    {% set e = params.E|default(1.0)|float %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{e} F2100
    G1 Z{z} F3000
    G90
    G1 X10 Y260 F6000

[gcode_macro RESUME]
description: Resume Current Print
rename_existing: BASE_RESUME
gcode:
    {% set e = params.E|default(1.0)|float %}
    G91
    G1 E{e} F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME

[gcode_macro CANCEL_PRINT]
description: Cancel Current Print
rename_existing: BASE_CANCEL_PRINT
gcode:
    PRINT_END
    BASE_CANCEL_PRINT

[gcode_macro LOAD_CELL_TARE]
description: Tare the Nozzle Load Cell Sensor
gcode:
    _LOAD_CELL_TARE
