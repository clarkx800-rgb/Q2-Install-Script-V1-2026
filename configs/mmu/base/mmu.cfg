[mmu_machine]
happy_hare_version: 4.0.0
units: mmu

[mcu mmu]
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_4E002D001051353033353536-if00

[mmu_toolhead default]
extruder_switch_pin: !THR:PA1

toolhead_extruder_to_nozzle: 79
toolhead_entry_to_extruder: 22
toolhead_residual_filament: 1
toolhead_ooze_reduction: 2
toolhead_sensor_to_nozzle: 100
register_toolhead_sensors   : 1

[mmu_parameters]
# Industrial Console Logging: Quiet terminal, detailed file logging
log_level: 0
log_file_level: 1
log_statistics: 0
log_visual: 0
log_startup_status: 0
log_m117_messages: 0

# Tip forming parameters
force_form_tip_standalone: 1
form_tip_macro: _MMU_CUT_TIP

# Filament Management
endless_spool_enabled: 1
endless_spool_on_load: 0
endless_spool_eject_gate: -1
spoolman_support: push
t_macro_color: slicer

startup_reset_ttg_map      : 1
filament_recovery_on_pause : 1	
print_start_detection      : 1
t_macro_color              : slicer

extruder_load_speed        : 12
extruder_unload_speed      : 12
extruder_sync_load_speed   : 12
extruder_sync_unload_speed : 12
extruder_homing_speed      : 12
extruder_accel             : 1500

# Macro wiring
pause_macro               : PAUSE
action_changed_macro      : _MMU_ACTION_CHANGED
print_state_changed_macro : _MMU_PRINT_STATE_CHANGED
mmu_event_macro           : _MMU_EVENT
post_preload_macro        : _MMU_POST_PRELOAD
pre_unload_macro          : _MMU_PRE_UNLOAD
post_form_tip_macro       : _MMU_POST_FORM_TIP
post_unload_macro         : _MMU_POST_UNLOAD
pre_load_macro            : _MMU_PRE_LOAD
post_load_macro           : _MMU_POST_LOAD
unload_sequence_macro     : _MMU_UNLOAD_SEQUENCE
purge_macro               : _MMU_PURGE
load_sequence_macro       : _MMU_LOAD_SEQUENCE

# has_bypass: 1

#DRYING
drying_data: {
    'pla'   : (45, 300),
    'pla+'  : (55, 300),
    'petg'  : (60, 300),
    'tpu'   : (55, 300),
    'abs'   : (70, 300),
    'abs+'  : (75, 300),
    'asa'   : (65, 300),
    'nylon' : (75, 600),
    'pc'    : (75, 600),
    'pva'   : (75, 600),
    'hips'  : (75, 600)
    }