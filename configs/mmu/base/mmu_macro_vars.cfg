# PERSISTED STATE ---------------------------------------------------------
# [save_variables]
# filename =/home/mks/printer_data/config/saved_variables.cfg

# NECESSARY KLIPPER OVERRIDES ---------------------------------------------
[extruder]
max_extrude_only_distance: 200
max_extrude_cross_section: 50

[respond]
[display_status]
[pause_resume]
[virtual_sdcard]
path: ~/printer_data/gcodes

# PRINT START/END ---------------------------------------------------------
[gcode_macro _MMU_SOFTWARE_VARS]
description: Happy Hare optional configuration for print start/end checks
gcode: # Leave empty

variable_user_pre_initialize_extension      : '_AUTO_SYNC_PRINT_JOB'	; Executed at start of MMU_START_SETUP. Commonly G28 to home
variable_home_mmu                           : False	; True/False, Whether to home mmu before print starts
variable_check_gates                        : False	; True/False, Whether to check filament is loaded in all gates used
variable_load_initial_tool                  : False	; True/False, Whether to automatically load initial tool
variable_automap_strategy                   : "none"	; none|filament_name|material|color|closest_color|spool_id

variable_user_print_end_extension           : ''	; Executed at start of MMU_END. Good place to move off print
variable_unload_tool                        : False	; Set to False: PRINT_END already handles unload before M84
variable_reset_ttg                          : False	; True/False, Whether reset TTG map at end of print
variable_dump_stats                         : True	; True/False, Whether to display print stats at end of print


# STATE MACHINE CHANGES ---------------------------------------------------
[gcode_macro _MMU_STATE_VARS]
description: Happy Hare configuration for state change hooks
gcode: # Leave empty

variable_user_action_changed_extension      : ''
variable_user_print_state_changed_extension : ''
variable_user_mmu_event_extension           : ''
variable_cutter_blade_limit                 : 1000


# SEQUENCE MACRO - PARKING MOVEMENT AND TOOLCHANGE CONTROL ----------------
[gcode_macro _MMU_SEQUENCE_VARS]
description: Happy Hare sequence macro configuration variables
gcode: # Leave empty

variable_enable_park_printing   : 'runout,load,pause,cancel'
variable_enable_park_standalone : 'unload,toolchange'
variable_enable_park_disabled   : '' #'pause,cancel'

variable_min_toolchange_z       : 2.0

variable_park_toolchange        : 91, 288, 0, 0, 5
variable_park_runout            : 91, 288, 0, 0, 0
variable_park_pause             : 91, 288, 0, 0, 0
variable_park_cancel            : 91, 288, 0, 0, 0
variable_park_complete          : 91, 271, 0, 0, 0

variable_pre_unload_position    : 91, 288, 0
variable_post_form_tip_position : 91, 288, 0
variable_pre_load_position      : 91, 288, 0

variable_restore_xy_pos         : "next"

variable_park_travel_speed      : 200
variable_park_lift_speed        : 15
variable_retract_speed          : 30
variable_unretract_speed        : 35

variable_user_park_move_macro   : 'MOVE_TO_TRASH'

variable_auto_home              : True
variable_timelapse              : False

# Sequence lifecycle extension hooks
variable_user_mmu_error_extension     : 'MOVE_TO_TRASH'
variable_user_pre_unload_extension    : '_CUSTOM_PRE_UNLOAD_ACTION'
variable_user_post_form_tip_extension : ''
variable_user_post_unload_extension   : 'MOVE_TO_TRASH'
variable_user_pre_load_extension      : ''
variable_user_post_load_extension     : '_CUSTOM_POST_LOAD_ACTION'


# CUT_TIP -----------------------------------------------------------------
[gcode_macro _MMU_CUT_TIP_VARS]
description: Happy Hare toolhead tip cutting macro configuration variables
gcode: # Leave empty

variable_restore_position       : False
variable_blade_pos              : 55
variable_retract_length         : 8
variable_simple_tip_forming     : False
variable_cut_axis_steppers      : 'stepper_x, stepper_y'
variable_cut_stepper_current    : 115
variable_cutting_axis           : "x"
variable_pin_loc_xy             : 15, 0.5
variable_pin_park_dist          : 5
variable_pin_loc_compressed_xy  : -0.5, 0.5
variable_rip_length             : 5
variable_rip_speed              : 20
variable_pushback_length        : 0
variable_pushback_dwell_time    : 0
variable_travel_speed           : 150
variable_cut_fast_move_speed    : 120
variable_cut_slow_move_speed    : 30
variable_evacuate_speed         : 150
variable_cut_dwell_time         : 100
variable_cut_fast_move_fraction : 0.97
variable_extruder_move_speed    : 25
variable_safe_margin_xy         : 50, 50
variable_gantry_servo_enabled   : False
variable_gantry_servo_down_angle: 55
variable_gantry_servo_up_angle  : 180


# FORM_TIP ----------------------------------------------------------------
[gcode_macro _MMU_FORM_TIP_VARS]
description: Happy Hare tip forming macro configuration variables
gcode: # Leave empty

variable_ramming_volume            : 0
variable_ramming_volume_standalone : 0
variable_toolchange_temp        : 0
variable_toolchange_fan_assist  : 0
variable_toolchange_fan_name    : 'fan_generic cooling_fan'
variable_toolchange_fan_speed   : 60
variable_unloading_speed_start  : 80
variable_unloading_speed        : 30
variable_cooling_tube_position  : 24
variable_cooling_tube_length    : 20
variable_initial_cooling_speed  : 10
variable_final_cooling_speed    : 60
variable_cooling_moves          : 4
variable_use_skinnydip          : False
variable_skinnydip_distance     : 30
variable_dip_insertion_speed    : 30
variable_dip_extraction_speed   : 70
variable_melt_zone_pause        : 0
variable_cooling_zone_pause     : 0
variable_use_fast_skinnydip     : False
variable_parking_distance       : 0
variable_extruder_eject_speed   : 25


# PURGE -------------------------------------------------------------------
[gcode_macro _MMU_PURGE_VARS]
description: Happy Hare reference purging macro configuration variables
gcode: # Leave empty

variable_extruder_purge_speed   : 12


# CLIENT MACROS -----------------------------------------------------------
[gcode_macro _MMU_CLIENT_VARS]
description: Happy Hare client macro configuration variables
gcode: # Leave empty

variable_reset_ttg_on_cancel    : False
variable_unload_tool_on_cancel  : False
variable_user_pause_extension   : ''
variable_user_resume_extension  : ''
variable_user_cancel_extension  : ''


# Tool change macro mappings
[gcode_macro T0]
gcode: MMU_CHANGE_TOOL TOOL=0
[gcode_macro T1]
gcode: MMU_CHANGE_TOOL TOOL=1
[gcode_macro T2]
gcode: MMU_CHANGE_TOOL TOOL=2
[gcode_macro T3]
gcode: MMU_CHANGE_TOOL TOOL=3