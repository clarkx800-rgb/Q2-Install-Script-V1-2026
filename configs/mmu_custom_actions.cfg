[gcode_macro _CUSTOM_POST_LOAD_ACTION]
description: Phase 6 Dynamic Thermal Ramp & Shift Purge, Phase 7 Active Cooldown, Phase 8 Fast Wiper & Tower Handoff
variable_last_material_temp: 220.0
gcode:
    {% set filament_area = 2.4053 %}
    {% set active_gate = printer.mmu.gate|default(0)|int %}
    {% set current_target = printer.extruder.target|float %}
    {% set is_printing = printer.print_stats.state == "printing" or printer.virtual_sdcard.is_active|default(false) %}
    {% set is_print_start = printer["gcode_macro _PRINT_VARS"].is_print_start|default(0)|int if "gcode_macro _PRINT_VARS" in printer else 0 %}

    # 1. Resolve Target Temp
    {% set target_temp = current_target %}
    {% if target_temp < 180.0 %}
        {% if printer.mmu.gate_temperature is defined and active_gate >= 0 and active_gate < printer.mmu.gate_temperature|length %}
            {% set gate_t = printer.mmu.gate_temperature[active_gate]|float %}
            {% set target_temp = gate_t if gate_t >= 180.0 else 220.0 %}
        {% else %}
            {% set target_temp = 220.0 %}
        {% endif %}
    {% endif %}

    # During PRINT_START, toolhead is positioned over chute void and initial tool is loaded.
    # All remnant purging, fan freeze dwell, slow retract, cooling, and wiping are handled
    # exclusively by _REMNANT_PURGE and _DUAL_CLEANING.
    {% if is_print_start == 1 %}
        SET_GCODE_VARIABLE MACRO=_CUSTOM_POST_LOAD_ACTION VARIABLE=last_material_temp VALUE={target_temp}
        RESPOND MSG="[MMU] Initial tool T{active_gate} loaded for PRINT_START. Handoff to _REMNANT_PURGE."
    {% else %}
        # 2. Required Core Melt Temp
        {% set core_temp = last_material_temp|float %}
        {% set flush_temp = [core_temp, target_temp]|max %}

        # 3. Position over chute
        MOVE_TO_TRASH
        M400
        M106 S0
        {% if 'fan_generic cooling_fan' in printer %}
            SET_FAN_SPEED FAN=cooling_fan SPEED=0
        {% endif %}

        # 4. Thermal Ramp
        {% if printer.extruder.temperature < (flush_temp - 2.0) %}
            M109 S{flush_temp}
        {% endif %}

        # 5. Purge Volume Calculation
        {% set raw_slicer_vol = 0.0 %}
        {% if printer.mmu.slicer_tool_map is defined and printer.mmu.slicer_tool_map.purge_volumes is defined %}
            {% set pv = printer.mmu.slicer_tool_map.purge_volumes %}
            {% if pv is iterable and active_gate in pv %}
                {% set raw_slicer_vol = pv[active_gate]|float %}
            {% elif pv is number %}
                {% set raw_slicer_vol = pv|float %}
            {% endif %}
        {% endif %}

        {% set is_composite_core = (core_temp >= 280.0) %}
        {% if is_composite_core %}
            {% set advance_dist = [60.0, (raw_slicer_vol / filament_area)]|max %}
        {% elif raw_slicer_vol > 0.0 %}
            {% set advance_dist = [45.0, (raw_slicer_vol / filament_area)]|max %}
        {% else %}
            {% set advance_dist = 45.0 %}
        {% endif %}

        # Industrial single-line telemetry log
        RESPOND MSG="[MMU] T{active_gate} Active | Purge: {advance_dist|round(0)|int}mm @ {flush_temp|round(0)|int}C"

        # 6. Execute Stationary Purge into Chute
        G90
        M83
        G1 E5.0 F80
        G1 E{advance_dist - 5.0} F300
        # Mid-print toolchange: standard snappy 10mm retract @ 30mm/s
        G1 E-10.0 F1800
        M400

        # 7. Active Cooldown Assist
        _MMU_COOLDOWN_ASSIST TARGET={target_temp}

        # 8. Wiper pass (Fast pass for mid-print toolchanges; safe pass for standalone)
        {% if is_printing and not printer.pause_resume.is_paused %}
            CLEAN_NOZZLE_FAST
        {% else %}
            CLEAN_NOZZLE_SAFE
        {% endif %}
        M400

        # Reprime ONLY for automatic mid-print toolchanges (NEVER during pause, not standalone)
        {% if is_printing and not printer.pause_resume.is_paused %}
            M83
            G1 E9.0 F1200
            M400
        {% endif %}

        SET_GCODE_VARIABLE MACRO=_CUSTOM_POST_LOAD_ACTION VARIABLE=last_material_temp VALUE={target_temp}

        # Flag 10mm pending deretract for standalone or print resume
        {% if not is_printing or printer.pause_resume.is_paused %}
            SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=load_retracted_10mm VALUE=1
            RESPOND MSG="[SYS] Post-load 10mm anti-ooze retraction applied."
        {% endif %}

        # Standalone shutdown
        {% if not is_printing %}
            TURN_OFF_HEATERS
        {% endif %}
    {% endif %}


[gcode_macro CLEAN_NOZZLE_FAST]
description: Streamlined 50% silicone wiper pass for mid-print toolchanges (Zero Z movement)
gcode:
    SAVE_GCODE_STATE NAME=clean_nozzle_fast_state
    {% set saved_accel = printer.toolhead.max_accel %}
    
    M400
    G90
    MOVE_TO_TRASH
    M204 S5000

    # Freeze shock
    M106 S255
    G4 P1000
    
    # Lateral tail snaps
    G1 X115 F12000
    G1 X85 F12000
    M106 S0

    # 3 center blade passes
    {% for i in range(3) %}
        G1 X114 F5000
        G1 X100 F5000
    {% endfor %}

    G1 X125 F15000
    M400
    EXIT_TRASH_CORRIDOR
    M400

    SET_VELOCITY_LIMIT ACCEL={saved_accel}
    RESTORE_GCODE_STATE NAME=clean_nozzle_fast_state


[gcode_macro CLEAN_NOZZLE_SAFE]
description: Full multi-stage silicone wiper pass for standalone and deep cleaning
gcode:
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    {% set saved_accel = printer.toolhead.max_accel %}
    
    M400
    G90
    MOVE_TO_TRASH
    M204 S5000

    M106 S255
    G4 P2000
    
    G1 X115 F12000
    G1 X85 F12000
    G1 X115 F12000
    G1 X85 F12000
    M106 S0

    {% for i in range(5) %}
        G1 X103 F5000
        G1 X90 F5000
    {% endfor %}

    {% for i in range(6) %}
        G1 X114 F5000
        G1 X100 F5000
    {% endfor %}

    {% for i in range(3) %}
        G1 X103 F5000
        G1 X90 F5000
    {% endfor %}

    G1 X125 F15000
    M400
    EXIT_TRASH_CORRIDOR
    M400

    SET_VELOCITY_LIMIT ACCEL={saved_accel}
    RESTORE_GCODE_STATE NAME=clean_nozzle_state


[gcode_macro _CUSTOM_PRE_UNLOAD_ACTION]
description: Pre-unload hook to capture thermal state and retract 10mm before clearing hotend
variable_retraction_applied: 0
gcode:
    {% set current_temp = printer.extruder.temperature|float %}
    {% if current_temp >= 180.0 %}
        SET_GCODE_VARIABLE MACRO=_CUSTOM_POST_LOAD_ACTION VARIABLE=last_material_temp VALUE={current_temp}
    {% endif %}
    {% if printer["gcode_macro _CUSTOM_PRE_UNLOAD_ACTION"].retraction_applied|default(0)|int == 1 %}
        # Anti-ooze retraction already applied prior to cut; proceed straight to unload
        SET_GCODE_VARIABLE MACRO=_CUSTOM_PRE_UNLOAD_ACTION VARIABLE=retraction_applied VALUE=0
    {% else %}
        {% if printer.extruder.can_extrude %}
            M83
            G1 E-10.0 F1800
            M400
            RESPOND MSG="[SYS] Pre-unload 10mm anti-ooze retraction applied."
        {% endif %}
    {% endif %}


[gcode_macro _MMU_COOLDOWN_ASSIST]
description: Phase 7 Cooldown helper: applies 100% fan assist until target temperature is stabilized
gcode:
    {% set target = params.TARGET|default(0)|float %}
    {% set current = printer.extruder.temperature|float %}

    {% if target >= 180.0 and (current - target) > 3.0 %}
        M106 S255
        {% if 'fan_generic cooling_fan' in printer %}
            SET_FAN_SPEED FAN=cooling_fan SPEED=1.0
        {% endif %}

        M104 S{target}
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={target + 1.0}

        M106 S0
        {% if 'fan_generic cooling_fan' in printer %}
            SET_FAN_SPEED FAN=cooling_fan SPEED=0
        {% endif %}
    {% else %}
        M104 S{target}
    {% endif %}