# =====================================================================
# Screen / UI Command Bridges for Happy Hare MMU
# =====================================================================

[gcode_macro E_LOAD]
description: Bridge screen E_LOAD command to Happy Hare
gcode:
    {% set slot = params.SLOT|default(0)|int %}
    M118 UI Request: Load Slot {slot}
    MMU_SELECT GATE={slot}
    MMU_LOAD

[gcode_macro E_UNLOAD]
description: Bridge screen E_UNLOAD command to Happy Hare
gcode:
    {% set slot = params.SLOT|default(0)|int %}
    M118 UI Request: Unload Slot {slot}
    MMU_UNLOAD

[gcode_macro E_BOX]
description: Bridge screen E_BOX slot select command
gcode:
    {% set slot = params.SLOT|default(0)|int %}
    M118 UI Request: Select Slot {slot}
    MMU_SELECT GATE={slot}

[gcode_macro RFID_READ]
description: Dummy handler for RFID read attempts
gcode:
    {% set slot = params.SLOT|default('slot0') %}
    M118 UI Request: RFID read for {slot}

# =====================================================================
# HelixScreen Standard UI Macros (MMU & Q2 Integrated)
# =====================================================================

[gcode_macro LOAD_FILAMENT]
description: Standard Load Filament macro invoking MMU load
gcode:
    {% set default_gate = printer.mmu.gate if printer.mmu.gate >= 0 else 0 %}
    {% set gate = params.GATE|default(default_gate)|int %}
    {% if params.TEMP is defined %}
        {% set target_temp = params.TEMP|int %}
    {% elif printer.mmu.gate_temperature is defined and gate >= 0 and gate < printer.mmu.gate_temperature|length and printer.mmu.gate_temperature[gate] >= 180 %}
        {% set target_temp = printer.mmu.gate_temperature[gate]|int %}
    {% elif printer.extruder.target >= 180 %}
        {% set target_temp = printer.extruder.target|int %}
    {% else %}
        {% set target_temp = 220 %}
    {% endif %}
    RESPOND MSG="[MMU] Loading Gate {gate} ({target_temp}C)"
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    MOVE_TO_TRASH
    {% if printer.extruder.temperature < (target_temp - 5) %}
        M109 S{target_temp}
    {% endif %}
    MMU_SELECT GATE={gate}
    MMU_LOAD

[gcode_macro UNLOAD_FILAMENT]
description: Standard Unload Filament macro invoking MMU unload
gcode:
    {% if params.TEMP is defined %}
        {% set target_temp = params.TEMP|int %}
    {% elif printer.extruder.target >= 180 %}
        {% set target_temp = printer.extruder.target|int %}
    {% elif printer.mmu.gate >= 0 and printer.mmu.gate_temperature is defined and printer.mmu.gate < printer.mmu.gate_temperature|length and printer.mmu.gate_temperature[printer.mmu.gate] >= 180 %}
        {% set target_temp = printer.mmu.gate_temperature[printer.mmu.gate]|int %}
    {% else %}
        {% set target_temp = 220 %}
    {% endif %}
    RESPOND MSG="[MMU] Unload sequence initiated ({target_temp}C)"
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if printer.extruder.temperature < (target_temp - 5) %}
        M109 S{target_temp}
    {% endif %}
    MMU_UNLOAD

[gcode_macro PURGE]
description: Purge filament into trash chute with nozzle wipe
gcode:
    {% if params.TEMP is defined %}
        {% set target_temp = params.TEMP|int %}
    {% elif printer.extruder.target >= 180 %}
        {% set target_temp = printer.extruder.target|int %}
    {% elif printer.mmu.gate >= 0 and printer.mmu.gate_temperature is defined and printer.mmu.gate < printer.mmu.gate_temperature|length and printer.mmu.gate_temperature[printer.mmu.gate] >= 180 %}
        {% set target_temp = printer.mmu.gate_temperature[printer.mmu.gate]|int %}
    {% else %}
        {% set target_temp = 220 %}
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    MOVE_TO_TRASH
    {% if printer.extruder.temperature < (target_temp - 5) %}
        M109 S{target_temp}
    {% endif %}
    M83
    G1 E30 F300
    G1 E-1 F1800
    M400
    CLEAR_NOZZLE HOTEND={target_temp}

[gcode_macro CLEAN_NOZZLE]
description: Clean and wipe nozzle using built-in brush routine
gcode:
    CLEAR_NOZZLE {rawparams}

[gcode_macro Z_TILT_ADJUST]
rename_existing: _BASE_Z_TILT_ADJUST
description: Physical bed leveling (Z-tilt) with automatic homing
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    _BASE_Z_TILT_ADJUST {rawparams}

[gcode_macro BED_LEVEL]
description: Physical bed leveling (alias to Z_TILT_ADJUST)
gcode:
    Z_TILT_ADJUST {rawparams}

[gcode_macro HEAT_SOAK]
description: Standalone heat soak for bed and chamber
gcode:
    {% set bed = params.BED|default(65)|int %}
    {% set chamber = params.CHAMBER|default(0)|int %}
    RESPOND MSG="[SYS] Heat soak initiated: Bed {bed}C, Chamber {chamber}C"
    M140 S{bed}
    {% if chamber > 0 %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
        {% if printer['fan_generic auxiliary_cooling_fan'] is defined %}
            SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=1.0
        {% endif %}
        M141 S{chamber}
    {% endif %}
    M190 S{bed}
    {% if chamber > 0 %}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={chamber - 2.0}
        RESPOND MSG="[SYS] Chamber reached target ({chamber}C)"
        {% if printer['fan_generic auxiliary_cooling_fan'] is defined %}
            SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0
        {% endif %}
    {% endif %}
    RESPOND MSG="[SYS] Heat soak complete"

[gcode_macro M603]
description: Filament unload alias
gcode:
    UNLOAD_FILAMENT {rawparams}
