#####################################################################
# Universal Nonlinear Pressure Advance Calibration for Kalico
# Based on Prunt3D / Kalico bleeding-edge-v2 documentation:
# https://github.com/Prunt3D/kalico_for_prunt_board_3/blob/main/docs/Nonlinear_Pressure_Advance.md
#####################################################################

[pa_test]
# Kalico built-in virtual G-code streaming engine
size_x: 100
size_y: 50
height: 50
layer_height: 0.2
first_layer_height: 0.24
perimeters: 2
brim_width: 5
slow_velocity: 20
medium_velocity: 100
fast_velocity: 250
brim_velocity: 100
brim_accel: 500
filament_diameter: 1.75
fan_speed: 0.5

[gcode_macro NONLINEAR_PA_TEST]
description: Automated Nonlinear Pressure Advance Calibration Tower
variable_material: "PLA"
variable_hotend_temp: 210.0
variable_bed_temp: 60.0
variable_fan_speed: 0.5
variable_speed: 250.0
variable_slow_velocity: 20.0
variable_medium_velocity: 100.0
variable_fast_velocity: 250.0
variable_brim_velocity: 100.0
variable_brim_accel: 500.0
variable_flow_percent: 100.0
variable_accel: 5000
variable_nozzle: 0.4
variable_origin_x: 135.0
variable_origin_y: 135.0
variable_size_x: 100.0
variable_size_y: 50.0
variable_size_z: 50.0
variable_testparam: 0
variable_model: "tanh"
variable_lin_velocity: 1.0
variable_pa_value: 0.0
variable_pa_range: 0.01
variable_base_advance: 0.0
variable_base_offset: 0.0
variable_base_time_offset: 0.0
variable_skip_soak: 0
variable_tool: 0
gcode:
    # -------------------------------------------------------------
    # 1. MMU Tool / Gate Resolution
    # -------------------------------------------------------------
    {% set default_tool = printer.mmu.tool if (printer.mmu is defined and printer.mmu.enabled and printer.mmu.tool is defined and printer.mmu.tool >= 0) else 0 %}
    {% set tool = params.TOOL|default(params.EXTRUDER|default(default_tool))|int %}

    # -------------------------------------------------------------
    # 2. Material Profiles & Intelligent Defaults
    # -------------------------------------------------------------
    {% if params.MATERIAL is not defined and printer.mmu is defined and printer.mmu.enabled and printer.mmu.gate_material is defined and tool >= 0 and tool < printer.mmu.gate_material|length %}
        {% set mat = printer.mmu.gate_material[tool]|string|upper %}
    {% else %}
        {% set mat = params.MATERIAL|default("PLA")|upper %}
    {% endif %}

    {% if "PLA" in mat %}
        {% set def_bed = 60.0 %}
        {% set def_hotend = 210.0 %}
        {% set def_fan = 1.0 %}
    {% elif "PETG" in mat %}
        {% set def_bed = 75.0 %}
        {% set def_hotend = 240.0 %}
        {% set def_fan = 0.5 %}
    {% elif "ABS" in mat or "ASA" in mat %}
        {% set def_bed = 100.0 %}
        {% set def_hotend = 255.0 %}
        {% set def_fan = 0.2 %}
    {% elif "TPU" in mat %}
        {% set def_bed = 50.0 %}
        {% set def_hotend = 220.0 %}
        {% set def_fan = 0.5 %}
    {% elif "PC" in mat or "PA" in mat or "NYLON" in mat or "PPS" in mat %}
        {% set def_bed = 110.0 %}
        {% set def_hotend = 270.0 %}
        {% set def_fan = 0.2 %}
    {% else %}
        {% set def_bed = 60.0 %}
        {% set def_hotend = 210.0 %}
        {% set def_fan = 0.5 %}
    {% endif %}

    # Temperatures & Fan (explicit overrides take priority)
    {% set hotend_temp = params.TEMPERATURE|default(params.TARGET_TEMP|default(def_hotend))|float %}
    {% set bed_temp = params.BED_TEMP|default(def_bed)|float %}
    {% set fan_speed = params.FAN_SPEED|default(def_fan)|float %}

    # -------------------------------------------------------------
    # 3. Speeds & Kinematics
    # -------------------------------------------------------------
    {% set speed = params.SPEED|default(params.FAST_VELOCITY|default(250.0))|float %}
    {% set fast_vel = speed %}
    {% set med_vel = params.MEDIUM_VELOCITY|default(speed * 0.4)|float %}
    {% set slow_vel = params.SLOW_VELOCITY|default(20.0)|float %}
    {% set brim_vel = params.BRIM_VELOCITY|default(100.0)|float %}
    {% set brim_acc = params.BRIM_ACCEL|default(500.0)|float %}

    {% set max_printer_accel = printer.configfile.settings["printer"].max_accel|default(5000)|int %}
    {% set test_accel = params.ACCEL|default(max_printer_accel)|int %}

    # -------------------------------------------------------------
    # 4. Flow Ratio (M221 extrusion factor)
    # -------------------------------------------------------------
    {% set raw_flow = params.FLOW_RATIO|default(params.FLOW_RATE|default(params.FLOW|default(1.0)))|string|replace("%", "")|trim %}
    {% set flow = raw_flow|float %}
    {% if flow <= 0 %}
        {% set flow_percent = 100.0 %}
    {% elif flow > 2.0 %}
        {% set flow_percent = flow %}
    {% else %}
        {% set flow_percent = flow * 100.0 %}
    {% endif %}

    # -------------------------------------------------------------
    # 5. Universal Geometry & Bed Center Detection
    # -------------------------------------------------------------
    {% set nozzle_dia = params.NOZZLE|default(printer.configfile.settings.extruder.nozzle_diameter|default(0.4))|float %}
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set min_x = printer.toolhead.axis_minimum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set min_y = printer.toolhead.axis_minimum.y|float %}
    {% set center_x = (min_x + max_x) / 2.0 %}
    {% set center_y = (min_y + max_y) / 2.0 %}
    {% set origin_x = params.ORIGIN_X|default(center_x)|float %}
    {% set origin_y = params.ORIGIN_Y|default(center_y)|float %}

    {% set size_x = params.SIZE_X|default(100.0)|float %}
    {% set size_y = params.SIZE_Y|default(50.0)|float %}
    {% set size_z = params.HEIGHT|default(50.0)|float %}

    # -------------------------------------------------------------
    # 6. Calibration Parameter Selection
    # 0 = Advance, 1 = Offset, 2 = Time Offset
    # -------------------------------------------------------------
    {% set param_in = params.TESTPARAM|default(0)|string|lower %}
    {% if param_in in ["0", "advance", "linear", "linear_advance"] %}
        {% set testparam = 0 %}
    {% elif param_in in ["1", "offset", "non_linear", "nonlinear", "nonlinear_offset"] %}
        {% set testparam = 1 %}
    {% elif param_in in ["2", "time", "time_offset", "timeoffset", "delay"] %}
        {% set testparam = 2 %}
    {% else %}
        {% set testparam = 0 %}
    {% endif %}

    {% set default_model = printer.configfile.settings.extruder.pressure_advance_model|default("tanh")|string|lower %}
    {% set model = params.MODEL|default(default_model)|string|lower %}
    {% set default_vel = printer.configfile.settings.extruder.linearization_velocity|default(1.0)|float %}
    {% set lin_velocity = params.VELOCITY|default(params.LINEARIZATION_VELOCITY|default(default_vel))|float %}
    {% set pa_value = params.PA_VALUE|default(0.0)|float %}
    {% set pa_range = params.PA_RANGE|default(0.01)|float %}

    # Baseline PA values (fixed values while tuning another parameter)
    {% set base_advance = params.BASE_ADVANCE|default(params.ADVANCE|default(0.0))|float %}
    {% set base_offset = params.BASE_OFFSET|default(params.OFFSET|default(0.0))|float %}
    {% set base_time_offset = params.BASE_TIME_OFFSET|default(params.TIME_OFFSET|default(0.0))|float %}
    {% set skip_soak = params.SKIP_SOAK|default(0)|int %}

    # -------------------------------------------------------------
    # 7. Save Variables into Macro State
    # -------------------------------------------------------------
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=material VALUE="\"{mat}\""
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=hotend_temp VALUE={hotend_temp}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=bed_temp VALUE={bed_temp}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=fan_speed VALUE={fan_speed}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=speed VALUE={speed}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=slow_velocity VALUE={slow_vel}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=medium_velocity VALUE={med_vel}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=fast_velocity VALUE={fast_vel}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=brim_velocity VALUE={brim_vel}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=brim_accel VALUE={brim_acc}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=flow_percent VALUE={flow_percent}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=accel VALUE={test_accel}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=nozzle VALUE={nozzle_dia}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=origin_x VALUE={origin_x}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=origin_y VALUE={origin_y}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=size_x VALUE={size_x}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=size_y VALUE={size_y}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=size_z VALUE={size_z}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=testparam VALUE={testparam}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=model VALUE="\"{model}\""
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=lin_velocity VALUE={lin_velocity}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=pa_value VALUE={pa_value}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=pa_range VALUE={pa_range}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=base_advance VALUE={base_advance}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=base_offset VALUE={base_offset}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=base_time_offset VALUE={base_time_offset}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=skip_soak VALUE={skip_soak}
    SET_GCODE_VARIABLE MACRO=NONLINEAR_PA_TEST VARIABLE=tool VALUE={tool}

    # Summary in console
    {action_respond_info("========================================\n"
                         "CALIBRATING NONLINEAR PRESSURE ADVANCE\n"
                         "Material: %s (Nozzle: %.1fC, Bed: %.1fC)\n"
                         "MMU Tool / Gate: T%d\n"
                         "Test Speed: %.0f mm/s (Med: %.0f, Slow: %.0f)\n"
                         "Brim: %.0f mm/s @ %.0f mm/s^2 accel\n"
                         "Extrusion Flow: %.1f%%\n"
                         "Tuning Target: %s (Model: %s)\n"
                         "========================================" % (
                         mat, hotend_temp, bed_temp,
                         tool,
                         fast_vel, med_vel, slow_vel,
                         brim_vel, brim_acc,
                         flow_percent,
                         "Linear Advance [ADVANCE]" if testparam == 0 else ("Nonlinear Offset [OFFSET]" if testparam == 1 else "Time Offset [TIME_OFFSET]"),
                         model))}

    SAVE_GCODE_STATE NAME=PA_TEST_STATE
    UPDATE_DELAYED_GCODE ID=start_pa_test DURATION=0.1

[gcode_macro RUN_PA_TEST]
description: Convenience alias for NONLINEAR_PA_TEST
gcode:
    NONLINEAR_PA_TEST {rawparams}

[delayed_gcode start_pa_test]
gcode:
    {% set vars = printer["gcode_macro NONLINEAR_PA_TEST"] %}
    
    # 1. Dispatch universal start routine (heats, homes, MMU tool load, meshes)
    _PA_START_PRINT BED_TEMP={vars.bed_temp} HOTEND_TEMP={vars.hotend_temp} MATERIAL={vars.material} ACCEL={vars.accel} SKIP_SOAK={vars.skip_soak} TOOL={vars.tool}

    # 2. Apply filament flow ratio
    M221 S{vars.flow_percent}

    # 3. Initialize pressure advance model and baseline values
    SET_PRESSURE_ADVANCE MODEL={vars.model} VELOCITY={vars.lin_velocity} ADVANCE={vars.base_advance} OFFSET={vars.base_offset} TIME_OFFSET={vars.base_time_offset}

    # 4. Set up tuning tower by Z height
    {% set height = vars.size_z|float %}
    {% if vars.pa_value == 0 %}
        {% if vars.testparam == 0 %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=0.001
            {action_respond_info(">>> TUNING TOWER: Linear Advance (ADVANCE). Range: 0.0 to %.4f\n>>> FORMULA: linear_advance = measured_height_mm * 0.001" % (height * 0.001))}
        {% elif vars.testparam == 1 %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=OFFSET START=0 FACTOR=0.01
            {action_respond_info(">>> TUNING TOWER: Nonlinear Offset (OFFSET). Range: 0.0 to %.4f\n>>> FORMULA: nonlinear_offset = measured_height_mm * 0.01" % (height * 0.01))}
        {% elif vars.testparam == 2 %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=TIME_OFFSET START=0 FACTOR=0.0001
            {action_respond_info(">>> TUNING TOWER: Time Offset (TIME_OFFSET). Range: 0.0 to %.6f\n>>> FORMULA: pressure_advance_time_offset = measured_height_mm * 0.0001" % (height * 0.0001))}
        {% endif %}
    {% else %}
        {% set start = [vars.pa_value - vars.pa_range, 0.0]|max %}
        {% set delta = (vars.pa_value + vars.pa_range) - start %}
        {% set factor = delta / height %}
        {% if vars.testparam == 0 %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START={start} FACTOR={factor}
            {action_respond_info(">>> TUNING TOWER: Fine-tuning ADVANCE. Range: %.4f to %.4f\n>>> FORMULA: ADVANCE = %.4f + (measured_height_mm * %.6f)" % (start, start + delta, start, factor))}
        {% elif vars.testparam == 1 %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=OFFSET START={start} FACTOR={factor}
            {action_respond_info(">>> TUNING TOWER: Fine-tuning OFFSET. Range: %.4f to %.4f\n>>> FORMULA: OFFSET = %.4f + (measured_height_mm * %.6f)" % (start, start + delta, start, factor))}
        {% elif vars.testparam == 2 %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=TIME_OFFSET START={start} FACTOR={factor}
            {action_respond_info(">>> TUNING TOWER: Fine-tuning TIME_OFFSET. Range: %.6f to %.6f\n>>> FORMULA: TIME_OFFSET = %.6f + (measured_height_mm * %.6f)" % (start, start + delta, start, factor))}
        {% endif %}
    {% endif %}

    # 5. Strict Extruder Preheating Check
    # PRINT_PA_TOWER verifies that extruder target temperature matches TARGET_TEMP
    M109 S{vars.hotend_temp}

    # 6. Stream virtual G-code tower print (MUST BE LAST COMMAND in start_pa_test)
    PRINT_PA_TOWER NOZZLE={vars.nozzle} TARGET_TEMP={vars.hotend_temp} ORIGIN_X={vars.origin_x} ORIGIN_Y={vars.origin_y} SIZE_X={vars.size_x} SIZE_Y={vars.size_y} SLOW_VELOCITY={vars.slow_velocity} MEDIUM_VELOCITY={vars.medium_velocity} FAST_VELOCITY={vars.fast_velocity} BRIM_VELOCITY={vars.brim_velocity} BRIM_ACCEL={vars.brim_accel} FAN_SPEED={vars.fan_speed} FINAL_GCODE_ID=end_pa_test

[delayed_gcode end_pa_test]
gcode:
    {% set vars = printer["gcode_macro NONLINEAR_PA_TEST"] %}
    _PA_END_PRINT TOOL={vars.tool} MATERIAL={vars.material}
    RESTORE_GCODE_STATE NAME=PA_TEST_STATE
    {action_respond_info("========================================\n"
                         "NONLINEAR PA TEST COMPLETED!\n"
                         "Inspect the printed tower:\n"
                         "- Measure height (mm) from bed to best zone.\n"
                         "- Apply the formula displayed at test start.\n"
                         "========================================")}

[gcode_macro _PA_START_PRINT]
description: Universal start routine dispatcher for PA calibration
gcode:
    {% set bed_temp = params.BED_TEMP|float %}
    {% set hotend_temp = params.HOTEND_TEMP|float %}
    {% set material = params.MATERIAL|default("PLA")|string %}
    {% set accel = params.ACCEL|default(5000)|int %}
    {% set skip_soak = params.SKIP_SOAK|default(0)|int %}
    {% set filament_for_start = "PLA" if skip_soak == 1 else material %}
    {% set tool = params.TOOL|default(params.EXTRUDER|default(-1))|int %}

    # If MMU is present and tool was not specified, pick active tool or gate 0
    {% if tool < 0 %}
        {% if printer.mmu is defined and printer.mmu.enabled and printer.mmu.tool is defined and printer.mmu.tool >= 0 %}
            {% set tool = printer.mmu.tool %}
        {% else %}
            {% set tool = 0 %}
        {% endif %}
    {% endif %}

    # Dispatch to available start macro
    {% if "gcode_macro PRINT_START" in printer %}
        PRINT_START BED={bed_temp} HOTEND={hotend_temp} BED_TEMP={bed_temp} EXTRUDER_TEMP={hotend_temp} CHAMBER=0 EXTRUDER={tool} FILAMENT_TYPE="{filament_for_start}"
    {% elif "gcode_macro START_PRINT" in printer %}
        START_PRINT BED_TEMP={bed_temp} EXTRUDER_TEMP={hotend_temp} FILAMENT_TYPE="{filament_for_start}"
    {% else %}
        # Generic standalone fallback
        M140 S{bed_temp}
        M104 S150
        G90
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        M190 S{bed_temp}
        M109 S{hotend_temp}
    {% endif %}

    # Standalone line purge if available and not included in start macro
    {% if "gcode_macro PRIME_LINE" in printer %}
        PRIME_LINE
    {% elif "gcode_macro LINE_PURGE" in printer %}
        LINE_PURGE
    {% elif "gcode_macro LINE_PURGE2" in printer %}
        LINE_PURGE2
    {% endif %}

    # Ensure 10mm deretract is done if _PRINT_VARS has load_retracted_10mm
    {% if printer["gcode_macro _PRINT_VARS"] is defined and printer["gcode_macro _PRINT_VARS"].load_retracted_10mm|default(0)|int == 1 %}
        M83
        G1 E8.0 F1200
        SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=load_retracted_10mm VALUE=0
    {% endif %}

    # Set acceleration
    SET_VELOCITY_LIMIT ACCEL={accel}

[gcode_macro _PA_END_PRINT]
description: Universal end routine dispatcher for PA calibration
gcode:
    # Reset extrusion flow rate
    M221 S100

    # Restore default acceleration
    {% set default_accel = printer.configfile.settings["printer"].max_accel|default(5000)|int %}
    SET_VELOCITY_LIMIT ACCEL={default_accel}

    {% set tool = params.TOOL|default(params.EXTRUDER|default(-1))|int %}
    {% set material = params.MATERIAL|default("PLA")|string %}

    # Dispatch to available end macro
    {% if "gcode_macro PRINT_END" in printer %}
        PRINT_END CUR_EXTRUDER={tool} FILAMENT_TYPE="{material}" MAX_LAYER_Z={printer.toolhead.position.z}
    {% elif "gcode_macro END_PRINT" in printer %}
        END_PRINT
    {% else %}
        M104 S0
        M140 S0
        M106 S0
        G91
        G1 Z10 F600
        G90
        {% if "xyz" in printer.toolhead.homed_axes %}
            G28 X Y
        {% endif %}
    {% endif %}
