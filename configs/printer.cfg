# q2
# <MACRO_SUITE_START>
[include START-END-PAUSE-CANCEL/includes.cfg]
[include FAN-SETTINGS.cfg]
[include nonlinear_pa.cfg]
# <MACRO_SUITE_END>

[include timelapse.cfg]
[include plr.cfg]

# <MMU_SUITE_START>
[include mmu.cfg]
[include mmu_custom_actions.cfg]
[include mmu_ui_bridge.cfg]
#[include sync_spoolman.cfg]
# <MMU_SUITE_END>



[danger_options]
log_velocity_limit_changes: False
log_pressure_advance_changes: False
single_mcu_trsync_timeout: 0.05
multi_mcu_trsync_timeout: 0.05        # Tightened to 50ms to prevent high-speed drift
homing_start_delay: 0.001
homing_elapsed_distance_tolerance: 0.5


[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_643732373534350E35353635-if00
restart_method: command

[gcode_arcs]
resolution: 0.5

[output_pin Bed_Mesh]
pin: PE0                ; Or any unused logic pin on your mainboard MCU
value: 1
shutdown_value: 1

[exclude_object]

[mcu THR]
serial: /dev/ttyS4
restart_method: command
baud: 500000
# receive_window: 512

[temperature_sensor Host_CPU]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor toolhead]
sensor_type: temperature_mcu
sensor_mcu: THR
min_temp: 0
max_temp: 100

[respond]
default_type: echo

[save_variables] 
filename =/home/mks/printer_data/config/saved_variables.cfg


[resonance_tester]
accel_per_hz: 100
max_smoothing:0.4
accel_chip:lis2dw
probe_points:
   135, 135, 10
sweeping_period: 1.2
sweeping_accel: 200
# method: sweeping_vibrations
accel_per_hz: 100


[duplicate_pin_override]
pins:
  THR:PA11, THR:PA1

[filament_switch_sensor extruder_sensor]
switch_pin: !THR:PA1
pause_on_runout: False
runout_gcode:


[bed_screws]

screw1:30,30
screw1_name: Front left
screw2: 240,30
screw2_name: Front right
screw3: 240,240
screw3_name: Last right
screw4: 30,240


[force_move]
enable_force_move : True


[extruder]
step_pin:THR:PB9
dir_pin:!THR:PB8
enable_pin:!THR:PC15
rotation_distance: 53.7  #22.6789511 Bondtech 5mm Drive Gears
gear_ratio: 1517:170
microsteps: 16
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
min_temp: 0
max_temp: 375
min_extrude_temp: 175
smooth_time: 0.5 #0.000001
heater_pin:THR:PB15
sensor_type:MAX6675
sensor_pin:THR:PB12
# spi_speed: 100000
# spi_software_sclk_pin:THR:PB13
# spi_software_mosi_pin:THR:PA15
# spi_software_miso_pin:THR:PB14
# spi_bus:spi2
spi_bus: spi2_PB14_PC0_PB13
spi_speed:2000000
max_power: 1

# control: pid  
# pid_Kp:37.826
#pid_Ki=8.018
#pid_Kd=61.746

pressure_advance_smooth_time: 0.03 #0.02
max_extrude_cross_section: 50
instantaneous_corner_velocity: 12 #10
max_extrude_only_distance: 1000.0
max_extrude_only_velocity: 100
max_extrude_only_accel: 5000

pressure_advance: 0.04
# pressure_advance_model: recipr
# linearization_velocity: 1
# linear_advance: 0.0248
# nonlinear_offset: 0



[tmc2209 extruder]
uart_pin:THR:PC13
interpolate: False #True
run_current: 0.857
sense_resistor: 0.110
stealthchop_threshold: 0

[lis2dw]
cs_pin:THR:PA10
spi_software_sclk_pin:THR:PA5
spi_software_mosi_pin:THR:PA7
spi_software_miso_pin:THR:PA6
axes_map: y, z, -x

[printer]
kinematics:corexy
max_velocity: 500
max_accel: 15000
max_z_velocity: 15
max_z_accel: 300
square_corner_velocity: 5


[autotune_tmc stepper_x]
motor: qidi_x_y
tuning_goal: auto
sgt: 1


[autotune_tmc stepper_y]
motor: qidi_x_y
tuning_goal: auto
sgt: 1

[motor_constants qidi_x_y]
# Coil resistance, Ohms
resistance: 3.7
# Coil inductance, Henries
inductance: 0.004
# Holding torque, Nm
holding_torque: 0.73
# Nominal rated current, Amps
max_current: 2.0
# Steps per revolution (1.8deg motors use 200, 0.9deg motors use 400)
steps_per_revolution: 200


[stepper_x]
step_pin:PB4
dir_pin:!PB3
enable_pin:!PB5
microsteps:16
rotation_distance: 38.82
full_steps_per_rotation:200  
endstop_pin:tmc2240_stepper_x:virtual_endstop
use_sensorless_homing: True
position_min: -1
position_endstop: 271
position_max:275
homing_speed:80
homing_retract_dist:8
homing_retract_speed:60
homing_positive_dir:true
homing_accel:3500
min_home_dist: 3
#step_pulse_duration:0.0000001

[stepper_y]
step_pin:PC14
dir_pin:!PC13
enable_pin:!PC15
microsteps: 16
rotation_distance: 38.82
full_steps_per_rotation:200  
endstop_pin:tmc2240_stepper_y:virtual_endstop
use_sensorless_homing: True
position_min: -1
position_endstop: -1
position_max: 295
homing_speed:80
homing_retract_dist: 8
homing_retract_speed:60
homing_positive_dir:False
homing_accel:3500
min_home_dist: 3
#step_pulse_duration:0.0000001

[stepper_z]
step_pin:PC10
dir_pin:PA15
enable_pin:!PC11
microsteps: 32 #128
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop 
# endstop_pin_reverse:tmc2209_stepper_z:virtual_endstop
# position_endstop:0
# position_endstop_reverse:260
position_max:258
position_min: -2
homing_speed: 8
second_homing_speed: 5
homing_retract_dist: 3
homing_positive_dir:false
# homing_positive_dir_reverse:false
#step_pulse_duration:0.0000001

[stepper_z1]
step_pin:PB1
dir_pin:PB6
enable_pin:!PB0
microsteps: 32 #128
rotation_distance: 4
full_steps_per_rotation: 200
# endstop_pin_reverse:tmc2209_stepper_z1:virtual_endstop
#step_pulse_duration:0.0000001


# [safe_z_home]
# home_xy_position: 135, 135
# z_hop_speed: 8
# speed: 100
# z_hop: 10
# home_y_before_x:True

[z_tilt]
z_positions:
    -15, 137
    285, 137
points:
    30, 137
    240, 137
speed: 100
horizontal_move_z: 8
retries: 5
retry_tolerance: 0.03


[tmc2240 stepper_x]
spi_bus: spi1
spi_speed: 200000
cs_pin:PC12
diag0_pin:!PB8
interpolate: False
run_current: 1.07
home_current: 0.8 #0.9
rref: 12000
stealthchop_threshold:0
driver_SGT:1
driver_SLOPE_CONTROL:0 #2

# driver_TBL: 2
# driver_TOFF: 4
# driver_HSTRT: 5
# driver_HEND: 2
# driver_TPFD: 0

[tmc2240 stepper_y]
spi_bus: spi1
spi_speed: 200000
cs_pin:PD2
diag0_pin:!PC0
interpolate: False
rref: 12000
run_current: 1.07
home_current: 0.8 #0.9
stealthchop_threshold:0
driver_SGT:1
driver_SLOPE_CONTROL:0 #2

# driver_TBL: 2
# driver_TOFF: 4
# driver_HSTRT: 5
# driver_HEND: 2
# driver_TPFD: 0

[tmc2209 stepper_z1]
uart_pin: PB7
run_current: 1.00
sense_resistor: 0.110
#hold_current: 0.17
interpolate: True
stealthchop_threshold: 999999
diag_pin:^PA14
driver_SGTHRS:140

[tmc2209 stepper_z]
uart_pin: PC5
run_current: 1.00
sense_resistor: 0.110
#hold_current: 0.17
interpolate: True
stealthchop_threshold: 999999
diag_pin:^PC1
driver_SGTHRS:140

[heater_bed]
heater_pin: PC7
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin: PA4
max_power: 1.0
control = pid
# pid_Kp=63.418 
# pid_Ki=1.342 
# pid_Kd=749.125
pid_Kp=71.231 
pid_Ki=1.218 
pid_Kd=1041.758
pwm_cycle_time:0.01666
# Safety threshold: 0C ensures open-circuit / disconnected thermistors trigger an immediate ADC halt
min_temp: 0
max_temp: 125

[heater_generic chamber]
heater_pin:PC8
max_power:1
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin:PA1

control:pid
pid_Kp=63.418 
pid_Ki=1.342 
pid_Kd=749.125

# Safety threshold: 0C ensures open-circuit / disconnected thermistors trigger an immediate ADC halt
min_temp: 0
max_temp: 70
# z_max_limit:230

[verify_heater chamber]
# Calibrated safety window: checks for 1C gain every 120s; aborts within 2-3 mins if heat is stuck/unresponsive
max_error: 150
check_gain_time: 120
hysteresis: 5
heating_gain: 1


[temperature_sensor Chamber_Thermal_Protection_Sensor]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PA2
min_temp: 0
max_temp: 130

[verify_heater extruder]
max_error: 120
check_gain_time:20
hysteresis: 2
heating_gain: 2

[verify_heater heater_bed]
# Calibrated safety window: max_error 150 prevents detached thermistors from dumping line power unchecked
max_error: 150
check_gain_time: 120
hysteresis: 2
heating_gain: 1

#腔室循环风扇
[fan_generic chamber_circulation_fan]
pin: PA10
shutdown_speed: 0.0
cycle_time: 0.05
hardware_pwm: false
kick_start_time: 0.0
# off_below: 0.0

#腔室加热风扇
[controller_fan chamber_fan]
pin:PB14
max_power: 1.0
shutdown_speed: 0
kick_start_time: 0.5
heater:chamber
fan_speed: 1.0
# off_below: 0
# tachometer_pin:PC6
# tachometer_ppr: 2
# tachometer_poll_interval: 0.0015
stepper:


#热端冷却风扇
[heater_fan hotend_fan]
pin:THR:PA11
max_power: 1.0
shutdown_speed:1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
# off_below: 0
tachometer_pin:THR:PA12
# tachometer_ppr: 2
tachometer_poll_interval: 0.0015

#模型散热风扇
[fan_generic cooling_fan]
pin:THR:PA8
max_power: 1.0
shutdown_speed:0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
# off_below: 0.0
tachometer_pin:THR:PA9
# tachometer_ppr: 2
tachometer_poll_interval: 0.0015

[controller_fan board_fan]
pin:PA9
max_power:1.0
shutdown_speed:1.0
cycle_time:0.01
fan_speed: 1.0
stepper:stepper_z,stepper_z1


#侧面风扇
[fan_generic auxiliary_cooling_fan]
pin:PB15
shutdown_speed: 0.0
cycle_time: 0.05
hardware_pwm: false
kick_start_time: 0.0
# off_below: 0.0
# tachometer_pin:PC4
# tachometer_ppr: 2
# tachometer_poll_interval: 0.0015



[output_pin Polar_cooler]
pin: PB10
pwm: false
shutdown_value:0
value:0

[output_pin beeper]
pin:PC2
pwm: false
shutdown_value:0
value:0

[output_pin caselight]
pin:PC9
pwm: false
shutdown_value:0
value:1

[load_cell_probe]
sensor_type: cs1237
sclk_pin: THR:PB3
dout_pin: THR:PB4
sample_rate:640 #1280
gain: 128
# CS1237 channel and reference-output settings.
channel: A
refout_off: False
sensor_orientation: normal
# The nozzle is the probe. Save material/first-layer adjustment separately.
z_offset: 0
speed: 5 #5
lift_speed:5
samples: 2
sample_retract_dist: 3
samples_result: average
samples_tolerance: 0.025
samples_tolerance_retries: 10
# Force threshold in grams that counts as a tap.
# 75g is conservative for a direct-drive setup; lower if probe misses taps.
trigger_force: 75
force_safety_limit: 800
# Uncomment and fill in after running LOAD_CELL_CALIBRATE:
counts_per_gram: 172.49300
reference_tare_counts: -616024



[bed_mesh]
speed: 100 #100
horizontal_move_z: 3 #5
mesh_min:10,10
mesh_max:260,260  
probe_count:6,6
algorithm: bicubic #lagrange
bicubic_tension:0.2
mesh_pps: 2, 2
#fade_target:0

[idle_timeout]
timeout: 1500
gcode:
    {% if printer.pause_resume.is_paused %}
        RESPOND MSG="[SYS] Idle timeout: Cooling heaters to prevent baking, but holding motors to save print."
        # Pointed to the new Master RESUME macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer.extruder.target}
        M104 S0
        M140 S0
        M141 S0
        {% if printer['gcode_macro DISABLE_BOX_HEATER'] is defined %}
            DISABLE_BOX_HEATER
        {% endif %}
    {% else %}
        RESPOND MSG="[SYS] Idle timeout: Shutting down printer."
        TURN_OFF_HEATERS
        M84
    {% endif %}

[pause_resume]

[display_status]

[virtual_sdcard]
path: ~/printer_data/gcodes

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 10
keep_raw_data: False
show_macros_in_webui: True
timeout: 600
measurements_chunk_size: 2
max_freq: 110
dpi: 150


[input_shaper]
# enabled_extruders: extruder  # Disabled: Causes stepcompress invalid sequence crash with synced MMU gear motor & adaptive PA
shaper_type_x: smooth_mzv
smoother_freq_x: 51.5
# damping_ratio_x is not used for input smoothers
shaper_type_y: smooth_ei
smoother_freq_y: 45.6

[gcode_shell_command kill_shaketune_proc]
command: pkill -9 -f shaketune
timeout: 5.
verbose: False

[gcode_macro STOP_SHAKETUNE]
description: Terminate hanging Shake&Tune background tasks
gcode:
    RUN_SHELL_COMMAND CMD=kill_shaketune_proc
    RESPOND MSG="Shake&Tune processes killed."

[gcode_shell_command process_shaketune_data]
command: /home/mks/process_stdata.sh
timeout: 600.
verbose: True

[gcode_macro PROCESS_SHAKETUNE_DATA]
description: Process a .stdata file to generate its graph
gcode:
    {% set FILE = params.FILE|default("") %}
    {% if FILE != "" %}
        RESPOND MSG="Processing Shake&Tune data file: {FILE}"
        RUN_SHELL_COMMAND CMD=process_shaketune_data PARAMS="{FILE}"
    {% else %}
        RESPOND MSG="Usage: PROCESS_SHAKETUNE_DATA FILE=<filename.stdata>"
    {% endif %}


