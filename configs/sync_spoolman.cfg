[gcode_shell_command sync_spoolman_cmd]
command: python3 /home/mks/sync-spoolman.py --apply
timeout: 60.
verbose: True

[gcode_macro SYNC_SPOOLMAN]
description: Sync Spoolman with OrcaSlicer filament profiles
gcode:
    RESPOND MSG="Starting Spoolman sync from OrcaSlicer presets..."
    RUN_SHELL_COMMAND CMD=sync_spoolman_cmd
    RESPOND MSG="Spoolman sync complete."

[gcode_shell_command auto_sync_active_job_cmd]
command: /home/mks/scripts/auto_spoolman_mmu_sync.py
timeout: 30.
verbose: True

[gcode_macro _AUTO_SYNC_PRINT_JOB]
description: Auto-sync Spoolman and MMU for current active print file
gcode:
    RESPOND MSG="[Auto-Sync] Syncing Spoolman & MMU from active G-code..."
    RUN_SHELL_COMMAND CMD=auto_sync_active_job_cmd
